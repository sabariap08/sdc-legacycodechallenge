<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Legacy Code Rescue</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <script src="/static/js/api.js"></script>
    <script>
        if (!API.isLoggedIn() || API.role !== 'admin') { window.location.href = '/login'; }
        function logout() { API.clearAuth(); window.location.href = '/login'; }
        document.body.innerHTML = renderAdminLayout('leaderboard', 'Leaderboard');
        initTheme();
        document.getElementById('pageContent').innerHTML = `
            <div class="page-header"><h1>Leaderboard</h1><p>Team rankings based on submission scores</p></div>
            <div class="card">
                <div id="leaderboardContent"><div class="flex-center" style="padding:24px;"><span class="loading-spinner"></span></div></div>
            </div>
        `;
        async function loadLeaderboard() {
            const resp = await API.get('/api/admin/leaderboard');
            if (!resp) return;
            const data = await resp.json();
            if (data.leaderboard.length === 0) {
                document.getElementById('leaderboardContent').innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.inbox + '</div><h3>No submissions yet</h3><p>Leaderboard will populate as teams submit</p></div>';
                return;
            }
            let html = '<div class="table-container"><table><thead><tr><th>Rank</th><th>Team</th><th>Challenge</th><th>Score</th><th>Submitted</th></tr></thead><tbody>';
            for (const e of data.leaderboard) {
                const medal = e.rank <= 3 ? `#${e.rank}` : `#${e.rank}`;
                html += `<tr><td><strong>${medal}</strong></td><td>${escapeHtml(e.team_name)} <small class="text-muted font-mono">(${escapeHtml(e.team_code)})</small></td><td><span class="badge badge-info">${escapeHtml(e.challenge_code)}</span></td><td><strong style="font-size:16px;">${e.score}</strong></td><td>${formatDate(e.submitted_at)}</td></tr>`;
            }
            html += '</tbody></table></div>';
            document.getElementById('leaderboardContent').innerHTML = html;
        }
        loadLeaderboard();
    </script>
</body>
</html>
