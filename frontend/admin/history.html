<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event History - Legacy Code Rescue</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        .history-status { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:var(--radius-full); font-size:11px; font-weight:600; }
        .history-status.upcoming { background:var(--warning-bg); color:var(--warning); border:1px solid var(--warning-border); }
        .history-status.ongoing { background:var(--success-bg); color:var(--success); border:1px solid var(--success-border); }
        .history-status.completed { background:var(--primary-bg); color:var(--primary); border:1px solid var(--primary-border); }
        .history-status.cancelled, .history-status.draft { background:var(--bg-hover); color:var(--text-muted); border:1px solid var(--border); }
        .event-code-cell { font-family:var(--font-mono); font-weight:600; color:var(--primary); }
        @media (max-width:768px) {
            .history-card-mobile { display:block !important; }
            .history-table-wrap { display:none !important; }
        }
        .history-card-mobile { display:none; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px; margin-bottom:12px; }
        .history-card-mobile .card-row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--border); }
        .history-card-mobile .card-row:last-child { border-bottom:none; }
        .history-card-mobile .card-label { font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; }
        .history-card-mobile .card-value { font-size:13px; color:var(--text-primary); font-weight:500; }
    </style>
</head>
<body>
    <script src="/static/js/api.js"></script>
    <script>
        if (!API.isLoggedIn() || API.role !== 'admin') { window.location.href = '/login'; }
        function logout() { API.clearAuth(); window.location.href = '/login'; }
        document.body.innerHTML = renderAdminLayout('history', 'Event History');
        initTheme();
        document.getElementById('pageContent').innerHTML = `
            <div class="page-header with-actions">
                <div><h1>Event History</h1><p>Historical event records retrieved from the database</p></div>
                <div style="display:flex;gap:8px;">
                    <a href="/admin/event" class="btn btn-secondary btn-sm" style="text-decoration:none;">${ICONS.arrowLeft} Back to Event Control</a>
                    <button class="btn btn-ghost btn-sm" onclick="loadHistory()">${ICONS.refresh} Refresh</button>
                </div>
            </div>
            <div id="historyContent">
                <div class="flex-center" style="padding:48px;"><span class="loading-spinner"></span></div>
            </div>
        `;

        function formatDateLocal(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function formatDuration(minutes) {
            if (!minutes || isNaN(minutes)) return '-';
            const h = Math.floor(minutes / 60), m = minutes % 60;
            if (h > 0 && m > 0) return h + 'h ' + m + 'm';
            if (h > 0) return h + 'h';
            return m + 'm';
        }

        function durationFromTimes(start, end) {
            if (!start || !end) return '-';
            const diff = (new Date(end) - new Date(start)) / 60000;
            if (isNaN(diff) || diff < 1) return '-';
            return formatDuration(diff);
        }

        async function loadHistory() {
            const el = document.getElementById('historyContent');
            el.innerHTML = '<div class="flex-center" style="padding:48px;"><span class="loading-spinner"></span></div>';
            try {
                const resp = await API.get('/api/admin/event/history');
                if (!resp) { el.innerHTML = '<p class="text-muted" style="font-size:13px;">Failed to load history</p>'; return; }
                const data = await resp.json();
                const history = data.history || [];
                if (history.length === 0) {
                    el.innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.clipboard + '</div><h3>No Event History</h3><p>Archived events will appear here once an event is completed, cancelled or replaced.</p></div>';
                    return;
                }
                let tableHtml = '<div class="card"><div class="table-container history-table-wrap"><table><thead><tr><th>Event Code</th><th>Start Date &amp; Time</th><th>End Date &amp; Time</th><th>Calculated Duration</th><th>Created At</th><th>Status</th><th>Cancelled At</th><th>Cancellation Reason</th></tr></thead><tbody>';
                let cardsHtml = '';
                for (const h of history) {
                    const status = (h.status || 'unknown').toLowerCase();
                    const durStr = durationFromTimes(h.event_start_time, h.event_end_time);
                    tableHtml += '<tr>';
                    tableHtml += '<td><span class="event-code-cell">' + escapeHtml(h.event_code || '-') + '</span></td>';
                    tableHtml += '<td>' + formatDateLocal(h.event_start_time) + '</td>';
                    tableHtml += '<td>' + formatDateLocal(h.event_end_time) + '</td>';
                    tableHtml += '<td>' + durStr + '</td>';
                    tableHtml += '<td>' + formatDateLocal(h.created_datetime) + '</td>';
                    tableHtml += '<td><span class="history-status ' + status + '">' + escapeHtml(h.status || '-') + '</span></td>';
                    tableHtml += '<td>' + formatDateLocal(h.cancelled_at) + '</td>';
                    tableHtml += '<td>' + escapeHtml(h.cancellation_reason || '-') + '</td>';
                    tableHtml += '</tr>';
                    cardsHtml += '<div class="history-card-mobile">';
                    cardsHtml += '<div class="card-row"><span class="card-label">Code</span><span class="card-value event-code-cell">' + escapeHtml(h.event_code || '-') + '</span></div>';
                    cardsHtml += '<div class="card-row"><span class="card-label">Start</span><span class="card-value">' + formatDateLocal(h.event_start_time) + '</span></div>';
                    cardsHtml += '<div class="card-row"><span class="card-label">End</span><span class="card-value">' + formatDateLocal(h.event_end_time) + '</span></div>';
                    cardsHtml += '<div class="card-row"><span class="card-label">Duration</span><span class="card-value">' + durStr + '</span></div>';
                    cardsHtml += '<div class="card-row"><span class="card-label">Created At</span><span class="card-value">' + formatDateLocal(h.created_datetime) + '</span></div>';
                    cardsHtml += '<div class="card-row"><span class="card-label">Status</span><span class="history-status ' + status + '">' + escapeHtml(h.status || '-') + '</span></div>';
                    cardsHtml += '<div class="card-row"><span class="card-label">Cancelled At</span><span class="card-value">' + formatDateLocal(h.cancelled_at) + '</span></div>';
                    cardsHtml += '<div class="card-row"><span class="card-label">Reason</span><span class="card-value">' + escapeHtml(h.cancellation_reason || '-') + '</span></div>';
                    cardsHtml += '</div>';
                }
                tableHtml += '</tbody></table></div></div>';
                el.innerHTML = tableHtml + cardsHtml;
            } catch (e) { el.innerHTML = '<p class="text-muted" style="font-size:13px;">Failed to load history</p>'; }
        }

        loadHistory();
    </script>
</body>
</html>
