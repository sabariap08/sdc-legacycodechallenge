<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Control - Legacy Code Rescue</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        .status-hero { text-align:center; padding:32px; margin-bottom:24px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); position:relative; overflow:hidden; }
        .status-hero::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
        .status-hero.noevent::before { background:var(--text-muted); }
        .status-hero.upcoming::before { background:var(--warning); }
        .status-hero.ongoing::before { background:var(--success); }
        .status-hero.completed::before { background:var(--danger); }
        .status-hero.cancelled::before { background:var(--danger); }
        .status-label { font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
        .status-value { font-size:32px; font-weight:800; margin-bottom:4px; }
        .status-value.noevent { color:var(--text-muted); }
        .status-value.upcoming { color:var(--warning); }
        .status-value.ongoing { color:var(--success); }
        .status-value.completed { color:var(--danger); }
        .status-value.cancelled { color:var(--danger); }
        .event-code-badge { display:inline-flex; align-items:center; gap:6px; padding:6px 16px; background:var(--bg-input); border:1px solid var(--border); border-radius:var(--radius-full); font-family:var(--font-mono); font-size:14px; font-weight:600; color:var(--primary); margin-top:8px; cursor:pointer; transition:var(--transition); }
        .event-code-badge:hover { border-color:var(--primary); }
        .event-code-badge .copy-hint { font-size:10px; color:var(--text-muted); font-family:var(--font-sans); }
        .countdown-display { display:flex; justify-content:center; gap:12px; margin-top:20px; }
        .countdown-block { text-align:center; }
        .countdown-block .countdown-num { font-size:28px; font-weight:700; color:var(--primary); font-family:var(--font-mono); min-width:56px; display:block; }
        .countdown-block .countdown-label { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; }
        .info-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px; }
        .info-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px; text-align:center; }
        .info-card .info-label { font-size:10px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
        .info-card .info-value { font-size:14px; font-weight:600; color:var(--text-primary); }
        .info-card .info-value.muted { color:var(--text-muted); font-size:12px; }
        .info-card.wide { grid-column: span 3; }
        .action-row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px; }
        .action-row .btn { flex:1; min-width:180px; padding:16px 24px; font-size:14px; justify-content:center; }
        .cancelled-banner { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:var(--danger); padding:12px 16px; border-radius:var(--radius-md); font-size:13px; margin-bottom:16px; display:flex; gap:8px; align-items:center; }
        .duration-preview { margin-top:6px; font-size:12px; color:var(--primary); font-weight:600; }
        .readonly-field { opacity:0.6; font-family:var(--font-mono); }
        @media (max-width:640px) { .info-grid { grid-template-columns:1fr; } .info-card.wide { grid-column: span 1; } .action-row .btn { min-width:100%; } }
    </style>
</head>
<body>
    <script src="/static/js/api.js"></script>
    <script>
        if (!API.isLoggedIn() || API.role !== 'admin') { window.location.href = '/login'; }
        function logout() { API.clearAuth(); window.location.href = '/login'; }
        document.body.innerHTML = renderAdminLayout('event', 'Event Control');
        initTheme();
        document.getElementById('pageContent').innerHTML = `
            <div class="page-header with-actions">
                <div><h1>Event Control</h1><p>Manage the event lifecycle: New, Edit, Cancel</p></div>
                <button class="btn btn-secondary btn-sm" onclick="loadStatus()">${ICONS.refresh} Refresh</button>
            </div>
            <div id="error-msg" class="error-message"></div>
            <div id="success-msg" class="success-message"></div>

            <div id="cancelledBanner" class="cancelled-banner" style="display:none;">${ICONS.alertCircle} <span id="cancelledBannerText">This event has been cancelled.</span></div>

            <div class="status-hero noevent" id="statusHero">
                <div class="status-label">Current Event Status</div>
                <div class="status-value noevent" id="statusValue">Loading...</div>
                <div id="eventCodeWrap" style="display:none;">
                    <div class="event-code-badge" id="eventCodeBadge" onclick="copyEventCode()" title="Click to copy">
                        <span id="eventCodeText"></span>
                        <span class="copy-hint">copy</span>
                    </div>
                </div>
                <div id="countdownDisplay"></div>
            </div>

            <div class="info-grid" id="infoCards">
                <div class="info-card"><div class="info-label">Start Date & Time</div><div class="info-value muted" id="infoStart">Not set</div></div>
                <div class="info-card"><div class="info-label">End Date & Time</div><div class="info-value muted" id="infoEnd">Not set</div></div>
                <div class="info-card"><div class="info-label">Duration (Calculated)</div><div class="info-value muted" id="infoDuration">-</div></div>
                <div class="info-card wide"><div class="info-label">Created At</div><div class="info-value muted" id="infoCreated">-</div></div>
                <div class="info-card wide" id="infoCancelledCard" style="display:none;"><div class="info-label">Cancelled On</div><div class="info-value muted" id="infoCancelledAt">-</div></div>
                <div class="info-card wide" id="infoReasonCard" style="display:none;"><div class="info-label">Cancellation Reason</div><div class="info-value muted" id="infoReason">-</div></div>
            </div>

            <div class="action-row" id="actionRow">
                <button class="btn btn-primary" onclick="openNewEventModal()" id="newEventBtn" style="display:none;">+ New Event</button>
                <button class="btn btn-secondary" onclick="openEditModal()" id="editBtn" style="display:none;">Edit Event</button>
                <button class="btn btn-danger" onclick="openCancelModal()" id="cancelBtn" style="display:none;">Cancel Event</button>
                <a href="/admin/history" class="btn btn-ghost" style="flex:0;min-width:auto;text-decoration:none;align-self:center;">${ICONS.history} History</a>
            </div>

            <div id="newEventModal" class="modal-overlay">
                <div class="modal" style="max-width:520px;">
                    <div class="modal-header"><h3>+ New Event</h3><button class="modal-close" onclick="closeModal('newEventModal')">&times;</button></div>
                    <p style="font-size:13px; color:var(--text-secondary); margin-bottom:16px;">Set the start and end of the event. Duration is calculated automatically from these times.</p>
                    <form id="newEventForm">
                        <div class="form-group"><label>Start Date & Time <span style="color:var(--danger);">*</span></label><input type="datetime-local" id="newStartTime" required></div>
                        <div class="form-group"><label>End Date & Time <span style="color:var(--danger);">*</span></label><input type="datetime-local" id="newEndTime" required><div class="duration-preview" id="newDurationPreview"></div></div>
                        <div class="modal-footer" style="border-top:none;padding-top:8px;">
                            <button type="button" class="btn btn-secondary" onclick="closeModal('newEventModal')">Cancel</button>
                            <button type="submit" class="btn btn-primary" id="newEventSubmitBtn">Start New Event</button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="editModal" class="modal-overlay">
                <div class="modal" style="max-width:520px;">
                    <div class="modal-header"><h3>Edit Event</h3><button class="modal-close" onclick="closeModal('editModal')">&times;</button></div>
                    <form id="editForm">
                        <div class="form-group"><label>Event Code</label><input type="text" id="editEventCode" readonly disabled class="readonly-field"></div>
                        <div class="form-group"><label>Status</label><input type="text" id="editStatus" readonly disabled class="readonly-field"></div>
                        <div class="form-group"><label>Start Date & Time</label><input type="datetime-local" id="editStartTime"><small id="editStartHint" style="color:var(--text-muted); font-size:11px; margin-top:4px; display:block;"></small></div>
                        <div class="form-group"><label>End Date & Time <span style="color:var(--danger);">*</span></label><input type="datetime-local" id="editEndTime" required><div class="duration-preview" id="editDurationPreview"></div></div>
                        <div class="form-group form-check" style="display:flex; align-items:center; gap:8px;">
                            <input type="checkbox" id="editLeaderboard">
                            <label for="editLeaderboard" style="margin:0;">Enable public leaderboard</label>
                        </div>
                        <div class="modal-footer" style="border-top:none;padding-top:8px;">
                            <button type="button" class="btn btn-secondary" onclick="closeModal('editModal')">Cancel</button>
                            <button type="submit" class="btn btn-primary" id="editSubmitBtn">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="cancelModal" class="modal-overlay">
                <div class="modal" style="max-width:480px;">
                    <div class="modal-header"><h3>Cancel Event</h3><button class="modal-close" onclick="closeModal('cancelModal')">&times;</button></div>
                    <p style="font-size:13px; color:var(--text-secondary); margin-bottom:16px;">Cancelling ends this event. A cancellation reason is mandatory and the record remains available in History.</p>
                    <form id="cancelForm">
                        <div class="form-group"><label>Cancellation Reason <span style="color:var(--danger);">*</span></label><textarea id="cancelReason" rows="3" required placeholder="Explain why this event is being cancelled"></textarea></div>
                        <div class="modal-footer" style="border-top:none;padding-top:8px;">
                            <button type="button" class="btn btn-secondary" onclick="closeModal('cancelModal')">Back</button>
                            <button type="submit" class="btn btn-danger" id="cancelSubmitBtn">Cancel Event</button>
                        </div>
                    </form>
                </div>
            </div>
        `;

        let currentEvent = null;
        let currentComputedStatus = 'NO_EVENT';

        function copyEventCode() {
            if (currentEvent && currentEvent.event_code) {
                navigator.clipboard.writeText(currentEvent.event_code).then(() => {
                    const hint = document.querySelector('#eventCodeBadge .copy-hint');
                    if (hint) { hint.textContent = 'copied!'; setTimeout(() => { hint.textContent = 'copy'; }, 1500); }
                }).catch(() => {});
            }
        }

        function formatDateLocal(dateStr) {
            if (!dateStr) return 'N/A';
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function toLocalDatetimeValue(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            const pad = n => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        function formatDuration(minutes) {
            if (!minutes || isNaN(minutes)) return '-';
            const h = Math.floor(minutes / 60), m = minutes % 60;
            if (h > 0 && m > 0) return h + 'h ' + m + 'm';
            if (h > 0) return h + 'h';
            return m + 'm';
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function openNewEventModal() {
            document.getElementById('newStartTime').value = '';
            document.getElementById('newEndTime').value = '';
            document.getElementById('newDurationPreview').textContent = '';
            document.getElementById('newEventModal').classList.add('active');
        }

        function openEditModal() {
            if (!currentEvent) { showError('error-msg', 'No event configured to edit'); return; }
            document.getElementById('editEventCode').value = currentEvent.event_code || '-';
            document.getElementById('editStatus').value = currentComputedStatus || '-';
            document.getElementById('editStartTime').value = currentEvent.event_start_time ? toLocalDatetimeValue(currentEvent.event_start_time) : '';
            document.getElementById('editEndTime').value = currentEvent.event_end_time ? toLocalDatetimeValue(currentEvent.event_end_time) : '';
            document.getElementById('editLeaderboard').checked = !!currentEvent.leaderboard_enabled;
            updateEditDurationPreview();

            const startInput = document.getElementById('editStartTime');
            const hint = document.getElementById('editStartHint');
            if (currentComputedStatus === 'ONGOING') {
                startInput.disabled = true;
                startInput.style.opacity = '0.5';
                hint.textContent = 'Start time cannot be changed while the event is ongoing.';
            } else {
                startInput.disabled = false;
                startInput.style.opacity = '1';
                hint.textContent = '';
            }
            document.getElementById('editModal').classList.add('active');
        }

        function openCancelModal() {
            document.getElementById('cancelReason').value = '';
            document.getElementById('cancelModal').classList.add('active');
        }

        function updateNewDurationPreview() {
            const st = document.getElementById('newStartTime').value;
            const et = document.getElementById('newEndTime').value;
            const preview = document.getElementById('newDurationPreview');
            if (st && et) {
                const diff = (new Date(et) - new Date(st)) / 60000;
                if (diff > 0) preview.textContent = 'Duration: ' + formatDuration(diff);
                else if (diff <= 0) preview.textContent = 'End must be after start';
                else preview.textContent = '';
            } else preview.textContent = '';
        }

        function updateEditDurationPreview() {
            const st = document.getElementById('editStartTime').value;
            const et = document.getElementById('editEndTime').value;
            const curStart = currentEvent && currentEvent.event_start_time && document.getElementById('editStartTime').disabled ? new Date(currentEvent.event_start_time) : null;
            const startDt = st ? new Date(st) : curStart;
            const preview = document.getElementById('editDurationPreview');
            if (startDt && et) {
                const diff = (new Date(et) - startDt) / 60000;
                if (diff > 0) preview.textContent = 'Duration: ' + formatDuration(diff);
                else if (diff <= 0) preview.textContent = 'End must be after start';
            } else preview.textContent = '';
        }

        document.getElementById('newStartTime').addEventListener('change', updateNewDurationPreview);
        document.getElementById('newEndTime').addEventListener('change', updateNewDurationPreview);
        document.getElementById('editEndTime').addEventListener('change', updateEditDurationPreview);

        document.getElementById('newEventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError('error-msg'); hideSuccess('success-msg');
            const st = document.getElementById('newStartTime').value;
            const et = document.getElementById('newEndTime').value;
            if (!st || !et) { showError('error-msg', 'Start and End times are both required'); return; }
            if (new Date(et) <= new Date(st)) { showError('error-msg', 'End time must be after start time'); return; }
            const btn = document.getElementById('newEventSubmitBtn');
            btn.disabled = true; btn.textContent = 'Creating...';
            const body = { event_start_time: new Date(st).toISOString(), event_end_time: new Date(et).toISOString() };
            try {
                const resp = await API.post('/api/admin/event/new', body);
                const data = await resp.json();
                if (resp.ok) {
                    closeModal('newEventModal');
                    showSuccess('success-msg', 'New event created. Code: <strong>' + escapeHtml(data.event_code) + '</strong>');
                    loadStatus();
                } else { showError('error-msg', data.detail || data.message || 'Failed to create event'); }
            } catch (err) { showError('error-msg', err.message); }
            btn.disabled = false; btn.textContent = 'Start New Event';
        });

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError('error-msg'); hideSuccess('success-msg');
            const st = document.getElementById('editStartTime').value;
            const et = document.getElementById('editEndTime').value;
            if (!et) { showError('error-msg', 'End time is required'); return; }
            const startDt = st ? new Date(st) : null;
            if (startDt && new Date(et) <= startDt) { showError('error-msg', 'End time must be after start time'); return; }
            const btn = document.getElementById('editSubmitBtn');
            btn.disabled = true; btn.textContent = 'Saving...';
            const body = { event_end_time: new Date(et).toISOString(), leaderboard_enabled: document.getElementById('editLeaderboard').checked };
            if (startDt && !document.getElementById('editStartTime').disabled) {
                body.event_start_time = startDt.toISOString();
            }
            try {
                const resp = await API.put('/api/admin/event/current', body);
                const data = await resp.json();
                if (resp.ok) {
                    closeModal('editModal');
                    showSuccess('success-msg', 'Event configuration saved');
                    loadStatus();
                } else { showError('error-msg', data.detail || data.message || 'Failed to save'); }
            } catch (err) { showError('error-msg', err.message); }
            btn.disabled = false; btn.textContent = 'Save Changes';
        });

        document.getElementById('cancelForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError('error-msg'); hideSuccess('success-msg');
            const reason = document.getElementById('cancelReason').value.trim();
            if (!reason) { showError('error-msg', 'A cancellation reason is required'); return; }
            const btn = document.getElementById('cancelSubmitBtn');
            btn.disabled = true; btn.textContent = 'Cancelling...';
            try {
                const resp = await API.post('/api/admin/event/cancel', { reason: reason });
                const data = await resp.json();
                if (resp.ok) { closeModal('cancelModal'); showSuccess('success-msg', 'Event cancelled'); loadStatus(); }
                else { showError('error-msg', data.detail || data.message || 'Failed to cancel'); }
            } catch (err) { showError('error-msg', err.message); }
            btn.disabled = false; btn.textContent = 'Cancel Event';
        });

        async function loadStatus() {
            hideError('error-msg');
            try {
                const resp = await API.get('/api/admin/event/current');
                if (!resp) return;
                const data = await resp.json();
                currentEvent = data.event;
                currentComputedStatus = data.computed_status || 'NO_EVENT';

                const statusEl = document.getElementById('statusValue');
                const heroEl = document.getElementById('statusHero');
                const displayStatus = currentComputedStatus === 'NO_EVENT' ? 'No Event Configured' : currentComputedStatus;
                statusEl.textContent = displayStatus;
                const cls = currentComputedStatus.toLowerCase();
                statusEl.className = 'status-value ' + cls;
                heroEl.className = 'status-hero ' + cls;

                const cancelledBanner = document.getElementById('cancelledBanner');
                if (currentComputedStatus === 'CANCELLED' && currentEvent) {
                    cancelledBanner.style.display = 'flex';
                    document.getElementById('cancelledBannerText').textContent =
                        'This event has been cancelled. ' + (currentEvent.cancellation_reason ? 'Reason: ' + currentEvent.cancellation_reason : '');
                } else { cancelledBanner.style.display = 'none'; }

                const codeWrap = document.getElementById('eventCodeWrap');
                if (currentEvent && currentEvent.event_code) {
                    codeWrap.style.display = '';
                    document.getElementById('eventCodeText').textContent = currentEvent.event_code;
                } else { codeWrap.style.display = 'none'; }

                if (currentEvent) {
                    document.getElementById('infoStart').textContent = currentEvent.event_start_time ? formatDateLocal(currentEvent.event_start_time) : 'Not set';
                    document.getElementById('infoEnd').textContent = currentEvent.event_end_time ? formatDateLocal(currentEvent.event_end_time) : 'Not set';
                    document.getElementById('infoDuration').textContent = formatDuration(data.calculated_duration_minutes);
                    document.getElementById('infoCreated').textContent = formatDateLocal(currentEvent.created_datetime);
                    document.getElementById('infoCancelledCard').style.display = currentEvent.cancelled_at ? '' : 'none';
                    document.getElementById('infoReasonCard').style.display = currentEvent.cancellation_reason ? '' : 'none';
                    document.getElementById('infoCancelledAt').textContent = currentEvent.cancelled_at ? formatDateLocal(currentEvent.cancelled_at) : '-';
                    document.getElementById('infoReason').textContent = currentEvent.cancellation_reason || '-';
                } else {
                    document.getElementById('infoStart').textContent = 'Not set';
                    document.getElementById('infoEnd').textContent = 'Not set';
                    document.getElementById('infoDuration').textContent = '-';
                    document.getElementById('infoCreated').textContent = '-';
                    document.getElementById('infoCancelledCard').style.display = 'none';
                    document.getElementById('infoReasonCard').style.display = 'none';
                }

                const newEventBtn = document.getElementById('newEventBtn');
                const editBtn = document.getElementById('editBtn');
                const cancelBtn = document.getElementById('cancelBtn');
                const active = (currentComputedStatus === 'UPCOMING' || currentComputedStatus === 'ONGOING');
                newEventBtn.style.display = active ? 'none' : '';
                editBtn.style.display = active ? '' : 'none';
                cancelBtn.style.display = active ? '' : 'none';

                const countdownEl = document.getElementById('countdownDisplay');
                countdownEl.innerHTML = '';
                if (currentComputedStatus === 'UPCOMING' && data.countdown_seconds !== null && data.countdown_seconds !== undefined) {
                    startCountdown(data.countdown_seconds, 'countdownDisplay', 'Event starts in');
                } else if (currentComputedStatus === 'ONGOING' && data.remaining_seconds !== null && data.remaining_seconds !== undefined) {
                    startCountdown(data.remaining_seconds, 'countdownDisplay', 'Time remaining');
                }
            } catch (e) { console.error('Status load error:', e); }
        }

        function startCountdown(seconds, elementId, label) {
            let remaining = seconds;
            const el = document.getElementById(elementId);
            function update() {
                if (remaining <= 0) { el.innerHTML = '<p style="font-size:14px;color:var(--text-muted);">Reloading...</p>'; setTimeout(() => loadStatus(), 2000); return; }
                const d = Math.floor(remaining / 86400);
                const h = Math.floor((remaining % 86400) / 3600);
                const m = Math.floor((remaining % 3600) / 60);
                const s = remaining % 60;
                let html = '<div class="countdown-display">';
                if (d > 0) html += '<div class="countdown-block"><span class="countdown-num">' + String(d).padStart(2, '0') + '</span><span class="countdown-label">Days</span></div>';
                html += '<div class="countdown-block"><span class="countdown-num">' + String(h).padStart(2, '0') + '</span><span class="countdown-label">Hours</span></div>';
                html += '<div class="countdown-block"><span class="countdown-num">' + String(m).padStart(2, '0') + '</span><span class="countdown-label">Min</span></div>';
                html += '<div class="countdown-block"><span class="countdown-num">' + String(s).padStart(2, '0') + '</span><span class="countdown-label">Sec</span></div>';
                html += '</div>';
                el.innerHTML = html;
                remaining--;
                setTimeout(update, 1000);
            }
            update();
        }

        loadStatus();
    </script>
</body>
</html>
