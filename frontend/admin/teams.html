<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams - Legacy Code Rescue</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        .member-row { display:grid; grid-template-columns:1fr 1fr 32px; gap:8px; margin-bottom:8px; align-items:center; }
        .member-row input { width:100%; }
        .remove-member { background:none; border:none; color:var(--danger); cursor:pointer; font-size:18px; line-height:1; padding:4px; }
        .team-avatar { width:40px; height:40px; border-radius:var(--radius); background:var(--primary-bg); color:var(--primary); display:flex; align-items:center; justify-content:center; font-weight:700; }
    </style>
</head>
<body>
    <script src="/static/js/api.js"></script>
    <script>
        if (!API.isLoggedIn() || API.role !== 'admin') { window.location.href = '/login'; }
        function logout() { API.clearAuth(); window.location.href = '/login'; }
        document.body.innerHTML = renderAdminLayout('teams', 'Teams Management');
        initTheme();
        document.getElementById('pageContent').innerHTML = `
            <div class="page-header with-actions">
                <div><h1>Teams Management</h1><p>Create and manage teams with their members</p></div>
                <button class="btn btn-primary" onclick="showCreateForm()">${ICONS.add} Create Team</button>
            </div>
            <div id="error-msg" class="error-message"></div>
            <div id="success-msg" class="success-message"></div>
            <div class="card"><div id="teamsContent"><div class="flex-center" style="padding:24px;"><span class="loading-spinner"></span></div></div></div>
            <div id="formWrap" style="display:none;"></div>
            <div id="confirmModal" class="modal-overlay" onclick="closeConfirmModal()">
                <div class="modal" onclick="event.stopPropagation()">
                    <div class="modal-header"><h3 id="confirmTitle">Confirm</h3><button class="modal-close" onclick="closeConfirmModal()">&times;</button></div>
                    <div class="modal-body"><p id="confirmBody">Are you sure?</p></div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="closeConfirmModal()">Cancel</button>
                        <button class="btn btn-danger" id="confirmBtn">Confirm</button>
                    </div>
                </div>
            </div>
        `;

        function confirmModal(title, body, onConfirm) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmBody').textContent = body;
            document.getElementById('confirmBtn').onclick = () => { closeConfirmModal(); onConfirm(); };
            document.getElementById('confirmModal').classList.add('active');
        }
        function closeConfirmModal() { document.getElementById('confirmModal').classList.remove('active'); }

        async function loadTeams() {
            hideError('error-msg'); hideSuccess('success-msg');
            const pageHeader = document.querySelector('.page-content > .page-header');
            const card = document.querySelector('.page-content > .card');
            if (pageHeader) pageHeader.style.display = '';
            if (card) card.style.display = '';
            document.getElementById('formWrap').style.display = 'none';

            const resp = await API.get('/api/admin/teams');
            if (!resp) return;
            const data = await resp.json();
            if (data.teams.length === 0) {
                document.getElementById('teamsContent').innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.teams + '</div><h3>No teams created</h3><p>Create your first team to get started</p></div>';
                return;
            }
            let html = '<div class="table-container"><table><thead><tr><th>Team Code</th><th>Team Name</th><th>Members</th><th>Allocated Challenge</th><th>Actions</th></tr></thead><tbody>';
            for (const t of data.teams) {
                const ch = t.allocated_challenge;
                html += '<tr>';
                html += '<td><strong class="font-mono">' + escapeHtml(t.team_code) + '</strong></td>';
                html += '<td>' + escapeHtml(t.team_name) + '</td>';
                html += '<td>' + (t.team_count || (t.members && t.members.length) || 0) + '</td>';
                html += '<td>' + (ch ? '<span class="badge badge-info">' + escapeHtml(ch) + '</span>' : '<span class="text-muted">Not allocated</span>') + '</td>';
                html += '<td><div class="flex gap-1">';
                html += '<button class="btn btn-sm btn-secondary" onclick="viewTeam(\'' + escapeHtml(t.team_code) + '\')">View</button>';
                html += '<button class="btn btn-sm btn-outline" onclick="editTeam(\'' + escapeHtml(t.team_code) + '\')">Edit</button>';
                html += '<button class="btn btn-sm btn-danger" onclick="deleteTeam(\'' + escapeHtml(t.team_code) + '\',\'' + escapeHtml(t.team_name) + '\')">Delete</button>';
                html += '</div></td></tr>';
            }
            html += '</tbody></table></div>';
            document.getElementById('teamsContent').innerHTML = html;
        }

        async function viewTeam(code) {
            const resp = await API.get('/api/admin/teams/' + code);
            if (!resp) return;
            const data = await resp.json();
            const t = data.team;
            let membersHtml = '<p class="text-muted" style="font-size:13px;">No members</p>';
            if (t.members && t.members.length) {
                membersHtml = '<div style="display:flex;flex-direction:column;gap:8px;">';
                for (const m of t.members) {
                    membersHtml += '<div style="padding:12px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">';
                    membersHtml += '<div><strong>' + escapeHtml(m.name) + '</strong><div style="font-size:12px;color:var(--text-muted);">' + escapeHtml(m.email) + '</div></div>';
                    membersHtml += '<button class="btn btn-sm btn-outline" onclick="mailTo(\'' + escapeHtml(m.email) + '\')">Email</button>';
                    membersHtml += '</div>';
                }
                membersHtml += '</div>';
            }
            const pageHeader = document.querySelector('.page-content > .page-header');
            const card = document.querySelector('.page-content > .card');
            if (pageHeader) pageHeader.style.display = 'none';
            if (card) card.style.display = 'none';
            document.getElementById('formWrap').style.display = 'block';
            document.getElementById('formWrap').innerHTML = `
                <div class="team-detail-header">
                    <div class="team-avatar">${escapeHtml((t.team_name||'T').charAt(0).toUpperCase())}</div>
                    <div class="team-info">
                        <h2>${escapeHtml(t.team_name)}</h2>
                        <p><span class="font-mono">${escapeHtml(t.team_code)}</span> &middot; ${t.team_count || (t.members||[]).length} members</p>
                    </div>
                    <div style="margin-left:auto;display:flex;gap:8px;">
                        <button class="btn btn-sm btn-outline" onclick="editTeamFromDetail('${escapeHtml(t.team_code)}')">Edit</button>
                        <button class="btn btn-secondary btn-sm" onclick="loadTeams()">Back to List</button>
                    </div>
                </div>
                <div class="grid-2 mb-3">
                    <div class="card"><div class="card-header"><h3>Team Members</h3></div><div style="padding:16px;">${membersHtml}</div></div>
                    <div class="card">
                        <div class="card-header"><h3>Allocated Challenge</h3></div>
                        <div style="padding:16px;">
                            ${data.allocation && data.allocation.challenge_id ? ('<p><span class="badge badge-info">' + escapeHtml(data.allocation.challenge_id) + '</span> ' + escapeHtml(data.allocation.challenge_name || '') + '</p>') : '<p class="text-muted" style="font-size:13px;">No challenge allocated yet. Assign one from the Challenge Allocation page.</p>'}
                        </div>
                    </div>
                </div>`;
        }

        function mailTo(email) { window.location.href = 'mailto:' + email; }

        let challengeOptions = [];

        function renderTeamForm(title, initial) {
            document.getElementById('formWrap').style.display = 'block';
            document.getElementById('formWrap').innerHTML = `
                <div class="card" style="max-width:720px;">
                    <div class="flex-between mb-2"><h3>${title}</h3><button class="btn btn-sm btn-ghost" onclick="loadTeams()">Cancel</button></div>
                    <div id="formError" class="error-message"></div>
                    <div class="form-group"><label>Team Name</label><input type="text" id="teamName" value="${escapeHtml(initial.team_name)}" placeholder="Enter a unique team name"></div>
                    <div class="form-group"><label>Number of Members</label>
                        <select id="memberCount" onchange="rebuildMembers()">
                            ${[1,2,3,4].map(n => `<option value="${n}" ${(initial.team_count>4?4:initial.team_count)===n?'selected':''}>${n} Member${n>1?'s':''}</option>`).join('')}
                        </select>
                    </div>
                    <div id="membersContainer"></div>
                    <div class="form-group"><label>Allocate Challenge <span class="text-muted" style="font-weight:400;">(optional)</span></label>
                        <select id="teamChallenge">
                            <option value="">-- None --</option>
                            ${challengeOptions.map(c => `<option value="${escapeHtml(c.challenge_code)}" ${initial.allocation_challenge===c.challenge_code?'selected':''}>${escapeHtml(c.challenge_name)} (${escapeHtml(c.challenge_code)})</option>`).join('')}
                        </select>
                        <p class="text-muted" style="font-size:12px;margin-top:6px;">Choose a challenge to assign to this team. You can change it later from the Challenge Allocation page.</p>
                    </div>
                    <div style="display:flex;gap:8px;margin-top:8px;">
                        <button class="btn btn-primary" onclick="submitTeamForm('${escapeHtml(initial.team_code)}')" id="formSubmitBtn">Save Team</button>
                        <button class="btn btn-secondary" onclick="loadTeams()">Cancel</button>
                    </div>
                </div>`;
            document.getElementById('membersContainer').innerHTML = '';
            for (let i = 0; i < Math.min(initial.team_count, 4); i++) {
                const m = initial.members && initial.members[i];
                document.getElementById('membersContainer').innerHTML += memberRowHtml(i, m ? m.name : '', m ? m.email : '');
            }
        }

        async function loadChallengeOptions() {
            try {
                const resp = await API.get('/api/admin/allocations/options');
                if (!resp) return;
                const data = await resp.json();
                challengeOptions = data.challenges || [];
            } catch(e) { challengeOptions = []; }
        }

        function memberRowHtml(i, name, email) {
            return `<div class="member-row">
                <input type="text" id="mname_${i}" placeholder="Member ${i+1} name" value="${escapeHtml(name)}">
                <input type="email" id="memail_${i}" placeholder="email@example.com" value="${escapeHtml(email)}">
                <button class="remove-member" onclick="removeMember(${i})" title="Remove member">&times;</button>
            </div>`;
        }

        function rebuildMembers() {
            const count = parseInt(document.getElementById('memberCount').value);
            const container = document.getElementById('membersContainer');
            const existing = [];
            for (let i = 0; i < container.children.length; i++) {
                const row = container.children[i];
                existing.push({ name: (row.querySelector('[id^="mname_"]')||{}).value || '', email: (row.querySelector('[id^="memail_"]')||{}).value || '' });
            }
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                container.innerHTML += memberRowHtml(i, existing[i] ? existing[i].name : '', existing[i] ? existing[i].email : '');
            }
        }

        function removeMember(i) {
            const row = document.querySelector(`[id="mname_${i}"]`).closest('.member-row');
            row.remove();
            const count = document.querySelectorAll('#membersContainer .member-row').length;
            document.getElementById('memberCount').value = count;
            reindexMembers();
        }

        function reindexMembers() {
            const container = document.getElementById('membersContainer');
            const rows = container.querySelectorAll('.member-row');
            const data = [];
            rows.forEach(r => data.push({ name: (r.querySelector('input[type=text]')).value, email: (r.querySelector('input[type=email]')).value }));
            container.innerHTML = '';
            data.forEach((d, i) => container.innerHTML += memberRowHtml(i, d.name, d.email));
        }

        function showCreateForm() {
            hideError('error-msg'); hideSuccess('success-msg');
            const pageHeader = document.querySelector('.page-content > .page-header');
            const card = document.querySelector('.page-content > .card');
            if (pageHeader) pageHeader.style.display = 'none';
            if (card) card.style.display = 'none';
            loadChallengeOptions().then(() => renderTeamForm('Create New Team', { team_name: '', team_code: '', team_count: 2, members: [], allocation_challenge: '' }));
        }

        async function editTeam(code) {
            const resp = await API.get('/api/admin/teams/' + code);
            if (!resp) return;
            const data = await resp.json();
            const t = data.team;
            const pageHeader = document.querySelector('.page-content > .page-header');
            const card = document.querySelector('.page-content > .card');
            if (pageHeader) pageHeader.style.display = 'none';
            if (card) card.style.display = 'none';
            await loadChallengeOptions();
            renderTeamForm('Edit Team - ' + t.team_name, { team_name: t.team_name, team_code: t.team_code, team_count: t.team_count || (t.members||[]).length, members: t.members || [], allocation_challenge: data.allocation && data.allocation.challenge_id ? data.allocation.challenge_id : '' });
            window.scrollTo(0, 0);
        }

        function editTeamFromDetail(code) { editTeam(code); }

        async function submitTeamForm(code) {
            hideError('formError');
            const name = document.getElementById('teamName').value.trim();
            const rows = document.querySelectorAll('#membersContainer .member-row');
            const members = [];
            for (const row of rows) {
                const nm = (row.querySelector('input[type=text]')||{}).value || '';
                const em = (row.querySelector('input[type=email]')||{}).value || '';
                if (nm.trim()) members.push({ name: nm.trim(), email: em.trim() });
            }
            if (!name) { showError('formError', 'Team name is required'); return; }
            if (members.length === 0) { showError('formError', 'Add at least one member'); return; }
            for (const m of members) {
                if (!m.email.includes('@')) { showError('formError', 'Valid email required for member: ' + m.name); return; }
            }

            const btn = document.getElementById('formSubmitBtn');
            btn.disabled = true; btn.innerHTML = '<span class="loading-spinner"></span> Saving...';
            const payload = { team_name: name, team_count: members.length, members: members };
            const url = code ? '/api/admin/teams/' + encodeURIComponent(code) : '/api/admin/teams';
            const challengeSel = document.getElementById('teamChallenge');
            const challengeCode = challengeSel ? challengeSel.value : '';
            try {
                const resp = code ? await API.put(url, payload) : await API.post(url, payload);
                if (!resp) return;
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) {
                    showError('formError', extractError(data, 'Failed to save team'));
                    btn.disabled = false; btn.innerHTML = 'Save Team';
                    return;
                }
                const teamCode = (data.team_code || code || '').trim();
                if (challengeCode && teamCode) {
                    const allocResp = await API.put('/api/admin/allocations', [{ team_code: teamCode, challenge_id: challengeCode }]);
                    if (allocResp) {
                        const allocData = await allocResp.json().catch(() => ({}));
                        if (!allocResp.ok) {
                            showError('formError', 'Team saved, but challenge not assigned: ' + extractError(allocData, 'unknown error'));
                            btn.disabled = false; btn.innerHTML = 'Save Team';
                            return;
                        }
                    }
                }
                loadTeams();
            } catch(e) {
                console.error('Save Team failed:', e);
                showError('formError', 'Request failed: ' + (e && e.message ? e.message : String(e)));
            }
            btn.disabled = false; btn.innerHTML = 'Save Team';
        }

        function extractError(data, fallback) {
            if (!data) return fallback;
            if (data.detail == null) return fallback;
            if (typeof data.detail === 'string') return data.detail;
            if (Array.isArray(data.detail) && data.detail[0] && data.detail[0].msg) return data.detail[0].msg;
            return JSON.stringify(data.detail);
        }

        function deleteTeam(code, name) {
            confirmModal('Delete Team', 'Delete team "' + name + '" (' + code + ')? This cannot be undone.', async () => {
                const resp = await API.del('/api/admin/teams/' + encodeURIComponent(code));
                if (resp && resp.ok) { loadTeams(); }
                else { const d = resp ? await resp.json() : {}; showError('error-msg', d.detail || 'Failed to delete team'); }
            });
        }

        loadTeams();
    </script>
</body>
</html>
