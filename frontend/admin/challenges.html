<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositories - Legacy Code Rescue</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        .repo-source-toggle { display:flex; gap:4px; background:var(--bg-input); border-radius:var(--radius); padding:4px; margin-bottom:20px; }
        .repo-source-btn { flex:1; padding:10px 16px; border:none; background:transparent; border-radius:var(--radius-sm); font-size:13px; font-weight:600; color:var(--text-muted); cursor:pointer; transition:var(--transition); font-family:var(--font-sans); text-align:center; }
        .repo-source-btn.active { background:var(--bg-card); color:var(--text-primary); box-shadow:var(--shadow-sm); }
        .repo-source-btn:hover:not(.active) { color:var(--text-secondary); }
        .upload-zone { border:2px dashed var(--border); border-radius:var(--radius-md); padding:32px; text-align:center; cursor:pointer; transition:var(--transition); }
        .upload-zone:hover { border-color:var(--primary); background:var(--primary-bg); }
        .upload-zone.dragover { border-color:var(--primary); background:var(--primary-bg); }
    </style>
</head>
<body>
    <script src="/static/js/api.js"></script>
    <script>
        if (!API.isLoggedIn() || API.role !== 'admin') { window.location.href = '/login'; }
        function logout() { API.clearAuth(); window.location.href = '/login'; }
        document.body.innerHTML = renderAdminLayout('challenges', 'Repositories');
        initTheme();
        document.getElementById('pageContent').innerHTML = `
            <div class="page-header with-actions">
                <div><h1>Repositories</h1><p>Import challenge repositories via upload or link</p></div>
                <button class="btn btn-primary" onclick="showImportModal()">${ICONS.add} New Repository</button>
            </div>
            <div class="card">
                <div class="card-header"><h3>Imported Challenges</h3></div>
                <div id="challengesList"><div class="flex-center" style="padding:24px;"><span class="loading-spinner"></span></div></div>
            </div>
            <div id="deleteModal" class="modal-overlay" style="display:none;" onclick="closeDeleteModal()">
                <div class="modal" onclick="event.stopPropagation()">
                    <div class="modal-header"><h3>Delete Repository</h3><button class="modal-close" onclick="closeDeleteModal()">&times;</button></div>
                    <div class="modal-body"><p id="deleteBody">Are you sure?</p></div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                        <button class="btn btn-danger" id="deleteConfirmBtn">Delete</button>
                    </div>
                </div>
            </div>
            <div id="importModal" class="modal-overlay">
                <div class="modal" style="max-width:560px;">
                    <div class="modal-header"><h3>New Repository</h3><button class="modal-close" onclick="closeImportModal()">&times;</button></div>
                    <div id="import-error" class="error-message"></div>
                    <div class="repo-source-toggle">
                        <button class="repo-source-btn active" onclick="switchSource('upload', this)">Upload</button>
                        <button class="repo-source-btn" onclick="switchSource('link', this)">Link</button>
                    </div>
                    <div id="uploadForm">
                        <div class="form-group"><label>Challenge Name <span style="color:var(--danger);">*</span></label><input type="text" id="uploadName" placeholder="e.g. Python Calculator"></div>
                        <div class="form-group"><label>Challenge Code <span style="color:var(--danger);">*</span></label><input type="text" id="uploadCode" placeholder="e.g. CH-01"></div>
                        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
                            <div style="margin-bottom:8px;">${ICONS.archive}</div>
                            <p style="font-size:14px; font-weight:600; color:var(--text-secondary);">Drop ZIP file here or click to browse</p>
                            <p style="font-size:12px; color:var(--text-muted); margin-top:4px;">Supports ZIP files containing code</p>
                            <input type="file" id="fileInput" accept=".zip" style="display:none;" onchange="handleFileSelect(this)">
                        </div>
                        <div id="selectedFile" style="display:none; margin-top:12px; padding:10px; background:var(--bg-input); border:1px solid var(--border); border-radius:var(--radius); font-size:13px;"></div>
                    </div>
                    <div id="linkForm" style="display:none;">
                        <div class="form-group"><label>Challenge Code <span style="color:var(--danger);">*</span></label><input type="text" id="importCode" placeholder="e.g. CH-01"></div>
                        <div class="form-group"><label>Repository URL <span style="color:var(--danger);">*</span></label><input type="url" id="importUrl" placeholder="https://github.com/owner/repo.git"></div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="closeImportModal()">Cancel</button>
                        <button class="btn btn-primary" onclick="importRepo()" id="importBtn">Import</button>
                    </div>
                </div>
            </div>
        `;
        let currentSource = 'upload';
        let selectedFile = null;
        function switchSource(source, btn) {
            currentSource = source;
            document.querySelectorAll('.repo-source-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('uploadForm').style.display = source === 'upload' ? '' : 'none';
            document.getElementById('linkForm').style.display = source === 'link' ? '' : 'none';
        }
        function showImportModal() { document.getElementById('importModal').classList.add('active'); }
        function closeImportModal() { document.getElementById('importModal').classList.remove('active'); selectedFile = null; document.getElementById('selectedFile').style.display = 'none'; hideError('import-error'); }
        function handleFileSelect(input) {
            if (input.files.length > 0) {
                selectedFile = input.files[0];
                document.getElementById('selectedFile').innerHTML = '<strong>' + escapeHtml(selectedFile.name) + '</strong> (' + (selectedFile.size / 1024 / 1024).toFixed(2) + ' MB)';
                document.getElementById('selectedFile').style.display = '';
            }
        }
        const zone = document.getElementById('uploadZone');
        if (zone) {
            zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
            zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
            zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('dragover'); if (e.dataTransfer.files.length) { document.getElementById('fileInput').files = e.dataTransfer.files; handleFileSelect(document.getElementById('fileInput')); }});
        }
        async function importRepo() {
            hideError('import-error');
            if (currentSource === 'link') {
                const code = document.getElementById('importCode').value.trim();
                const url = document.getElementById('importUrl').value.trim();
                if (!code || !url) { showError('import-error', 'Fill all fields'); return; }
                const btn = document.getElementById('importBtn'); btn.disabled = true; btn.innerHTML = '<span class="loading-spinner"></span>';
                try {
                    const resp = await API.post('/api/admin/import-repositories', { challenges: [{ challenge_code: code, repository_url: url }] });
                    const data = await resp.json();
                    if (resp.ok) { closeImportModal(); loadChallenges(); }
                    else { showError('import-error', data.detail || 'Import failed'); }
                } catch (err) { showError('import-error', err.message); }
                btn.disabled = false; btn.innerHTML = 'Import';
            } else {
                const name = document.getElementById('uploadName').value.trim();
                const code = document.getElementById('uploadCode').value.trim();
                if (!name || !code) { showError('import-error', 'Challenge name and code are required'); return; }
                if (!selectedFile) { showError('import-error', 'Please select a ZIP file'); return; }
                if (!selectedFile.name.toLowerCase().endsWith('.zip')) { showError('import-error', 'Only ZIP files are supported'); return; }
                const btn = document.getElementById('importBtn'); btn.disabled = true; btn.innerHTML = '<span class="loading-spinner"></span>';
                const formData = new FormData();
                formData.append('challenge_name', name);
                formData.append('challenge_code', code);
                formData.append('file', selectedFile);
                try {
                    const headers = {};
                    if (API.token) headers['Authorization'] = 'Bearer ' + API.token;
                    const resp = await fetch('/api/admin/upload-challenge', { method: 'POST', headers, body: formData });
                    const data = await resp.json();
                    if (resp.ok) { closeImportModal(); loadChallenges(); }
                    else { showError('import-error', data.detail || 'Upload failed'); }
                } catch (err) { showError('import-error', err.message); }
                btn.disabled = false; btn.innerHTML = 'Import';
            }
        }
        function showDeleteModal(code, name) {
            document.getElementById('deleteBody').textContent = 'Delete repository "' + name + '" (' + code + ')? This will permanently remove all files from disk.';
            document.getElementById('deleteConfirmBtn').onclick = () => { closeDeleteModal(); deleteRepo(code); };
            document.getElementById('deleteModal').style.display = 'flex';
        }
        function closeDeleteModal() { document.getElementById('deleteModal').style.display = 'none'; }

        async function deleteRepo(code) {
            try {
                const resp = await API.del('/api/admin/challenges/' + code);
                if (resp && resp.ok) { loadChallenges(); }
                else { const d = resp ? await resp.json() : {}; alert(d.detail || 'Failed to delete'); }
            } catch(e) { alert('Connection error'); }
        }

        function viewRepo(code) {
            window.location.href = '/admin/repo-viewer?code=' + encodeURIComponent(code);
        }

        async function loadChallenges() {
            const resp = await API.get('/api/admin/challenges');
            if (!resp) return;
            const data = await resp.json();
            if (data.challenges.length === 0) {
                document.getElementById('challengesList').innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.inbox + '</div><h3>No challenges imported</h3><p>Click "New Repository" to add challenges</p></div>';
                return;
            }
            let html = '<div class="table-container"><table><thead><tr><th>Challenge</th><th>Name</th><th>Source</th><th>Status</th><th>Imported</th><th>Actions</th></tr></thead><tbody>';
            for (const ch of data.challenges) {
                const sourceBadge = ch.repository_source === 'upload' ? '<span class="badge badge-info">Upload</span>' : '<span class="badge badge-neutral">Link</span>';
                html += '<tr>';
                html += '<td><strong class="font-mono">' + escapeHtml(ch.challenge_code) + '</strong></td>';
                html += '<td>' + escapeHtml(ch.challenge_name || ch.challenge_code) + '</td>';
                html += '<td>' + sourceBadge + '</td>';
                html += '<td>' + getStatusBadge(ch.status) + '</td>';
                html += '<td>' + formatDate(ch.imported_at) + '</td>';
                html += '<td><div class="flex gap-1">';
                html += '<button class="btn btn-sm btn-secondary" onclick="viewRepo(\'' + escapeHtml(ch.challenge_code) + '\')">View</button>';
                html += '<button class="btn btn-sm btn-danger" onclick="showDeleteModal(\'' + escapeHtml(ch.challenge_code) + '\',\'' + escapeHtml(ch.challenge_name || ch.challenge_code) + '\')">Delete</button>';
                html += '</div></td></tr>';
            }
            html += '</tbody></table></div>';
            document.getElementById('challengesList').innerHTML = html;
        }
        loadChallenges();
    </script>
</body>
</html>
