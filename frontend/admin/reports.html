<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Legacy Code Rescue</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <script src="/static/js/api.js"></script>
    <script>
        if (!API.isLoggedIn() || API.role !== 'admin') { window.location.href = '/login'; }
        function logout() { API.clearAuth(); window.location.href = '/login'; }
        document.body.innerHTML = renderAdminLayout('reports', 'Reports');
        initTheme();
        document.getElementById('pageContent').innerHTML = `
            <div class="page-header">
                <div><h1>Reports</h1><p>Download professional reports and overview of the platform</p></div>
            </div>

            <div class="stats-grid" id="statsGrid"></div>

            <div class="report-grid">
                <div class="report-card" onclick="download('challenges')">
                    <div class="report-card-icon primary">${ICONS.archive}</div>
                    <div>
                        <div class="report-card-title">Download Challenges</div>
                        <div class="report-card-desc">All uploaded challenges with their codes and file counts</div>
                    </div>
                    <div class="report-card-link">${ICONS.download}</div>
                </div>
                <div class="report-card" onclick="download('teams')">
                    <div class="report-card-icon secondary">${ICONS.teams}</div>
                    <div>
                        <div class="report-card-title">Download Teams</div>
                        <div class="report-card-desc">Complete team and member information</div>
                    </div>
                    <div class="report-card-link">${ICONS.download}</div>
                </div>
                <div class="report-card" onclick="download('allocations')">
                    <div class="report-card-icon warning">${ICONS.target}</div>
                    <div>
                        <div class="report-card-title">Download Allocated Challenges</div>
                        <div class="report-card-desc">Teams, members and their allocated challenges</div>
                    </div>
                    <div class="report-card-link">${ICONS.download}</div>
                </div>
                <div class="report-card" onclick="download('status')">
                    <div class="report-card-icon success">${ICONS.alertCircle}</div>
                    <div>
                        <div class="report-card-title">Download Status</div>
                        <div class="report-card-desc">Overall platform status and allocation summary</div>
                    </div>
                    <div class="report-card-link">${ICONS.download}</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><h3>Challenges</h3></div>
                <div id="challengesContent"><div class="flex-center" style="padding:24px;"><span class="loading-spinner"></span></div></div>
            </div>
            <div class="card">
                <div class="card-header"><h3>Teams & Allocations</h3></div>
                <div id="teamsContent"><div class="flex-center" style="padding:24px;"><span class="loading-spinner"></span></div></div>
            </div>
            <div class="card">
                <div class="card-header"><h3>Release History</h3></div>
                <div id="releasesContent"><div class="flex-center" style="padding:24px;"><span class="loading-spinner"></span></div></div>
            </div>
        `;

        function download(type) {
            const headers = {};
            if (API.token) headers['Authorization'] = 'Bearer ' + API.token;
            const map = {
                challenges: ['/api/admin/reports/pdf/challenges', 'challenges_report.pdf'],
                teams: ['/api/admin/reports/pdf/teams', 'teams_report.pdf'],
                allocations: ['/api/admin/reports/pdf/allocations', 'allocated_challenges_report.pdf'],
                status: ['/api/admin/reports/pdf/status', 'status_report.pdf'],
            };
            const [path, filename] = map[type];
            fetch(path, { method: 'GET', headers })
                .then(resp => {
                    if (!resp.ok) { alert('Failed to generate report'); return null; }
                    return resp.blob();
                })
                .then(blob => {
                    if (!blob) return;
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                })
                .catch(() => alert('Connection error'));
        }

        async function loadReport() {
            try {
                const resp = await API.get('/api/admin/reports/data');
                if (!resp) return;
                const data = await resp.json();

                document.getElementById('statsGrid').innerHTML = `
                    <div class="stat-card"><div class="stat-header"><span class="stat-label">Total Challenges</span><span class="stat-icon primary">${ICONS.archive}</span></div><div class="stat-value">${data.total_challenges}</div></div>
                    <div class="stat-card"><div class="stat-header"><span class="stat-label">Total Teams</span><span class="stat-icon secondary">${ICONS.teams}</span></div><div class="stat-value">${data.total_teams}</div></div>
                    <div class="stat-card"><div class="stat-header"><span class="stat-label">Allocations</span><span class="stat-icon warning">${ICONS.target}</span></div><div class="stat-value">${data.allocations.length}</div></div>
                    <div class="stat-card"><div class="stat-header"><span class="stat-label">Releases</span><span class="stat-icon success">${ICONS.send}</span></div><div class="stat-value">${data.releases.length}</div></div>
                `;

                if (data.challenges.length === 0) {
                    document.getElementById('challengesContent').innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.inbox + '</div><h3>No challenges</h3></div>';
                } else {
                    let html = '<div class="table-container"><table><thead><tr><th>Challenge Code</th><th>Challenge Name</th></tr></thead><tbody>';
                    for (const c of data.challenges) {
                        html += '<tr><td><strong class="font-mono">' + escapeHtml(c.challenge_code) + '</strong></td><td>' + escapeHtml(c.challenge_name) + '</td></tr>';
                    }
                    html += '</tbody></table></div>';
                    document.getElementById('challengesContent').innerHTML = html;
                }

                if (data.teams.length === 0) {
                    document.getElementById('teamsContent').innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.inbox + '</div><h3>No teams</h3></div>';
                } else {
                    const allocMap = {};
                    for (const a of data.allocations) allocMap[a.team_code] = a;
                    let html = '<div class="table-container"><table><thead><tr><th>Team</th><th>Members</th><th>Allocated Challenge</th></tr></thead><tbody>';
                    for (const t of data.teams) {
                        const a = allocMap[t.team_code];
                        html += '<tr><td><strong class="font-mono">' + escapeHtml(t.team_code) + '</strong><br>' + escapeHtml(t.team_name) + '</td><td>' + t.team_count + '</td><td>' + (a && a.challenge_id ? '<span class="badge badge-info">' + escapeHtml(a.challenge_id) + '</span> ' + escapeHtml(a.challenge_name || '') : '<span class="text-muted">Not allocated</span>') + '</td></tr>';
                    }
                    html += '</tbody></table></div>';
                    document.getElementById('teamsContent').innerHTML = html;
                }

                if (data.releases.length === 0) {
                    document.getElementById('releasesContent').innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.inbox + '</div><h3>No releases yet</h3></div>';
                } else {
                    let html = '<div class="table-container"><table><thead><tr><th>Team</th><th>Challenge</th><th>Recipients</th><th>Status</th><th>Released</th></tr></thead><tbody>';
                    for (const r of data.releases) {
                        const ok = r.status === 'SENT';
                        html += '<tr><td><strong class="font-mono">' + escapeHtml(r.team_code) + '</strong><br>' + escapeHtml(r.team_name) + '</td><td>' + escapeHtml(r.challenge_name || r.challenge_code) + '</td><td>' + (r.recipients || []).join(', ') + '</td><td>' + (ok ? '<span class="badge badge-success">SENT</span>' : '<span class="badge badge-danger">FAILED</span>') + '</td><td>' + formatDate(r.released_at) + '</td></tr>';
                    }
                    html += '</tbody></table></div>';
                    document.getElementById('releasesContent').innerHTML = html;
                }
            } catch (e) { console.error(e); }
        }
        loadReport();
    </script>
</body>
</html>
