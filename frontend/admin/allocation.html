<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge Assignments - Legacy Code Rescue</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <script src="/static/js/api.js"></script>
    <script>
        if (!API.isLoggedIn() || API.role !== 'admin') { window.location.href = '/login'; }
        function logout() { API.clearAuth(); window.location.href = '/login'; }
        document.body.innerHTML = renderAdminLayout('allocation', 'Challenge Assignments');
        initTheme();
        document.getElementById('pageContent').innerHTML = `
            <div class="page-header">
                <div><h1>Challenge Assignments</h1><p>View which challenges are assigned to each team</p></div>
            </div>
            <div class="card">
                <div id="error-msg" class="error-message"></div>
                <div id="assignContent"><div class="flex-center" style="padding:24px;"><span class="loading-spinner"></span></div></div>
            </div>
        `;

        async function loadAssignments() {
            const teamsResp = await API.get('/api/admin/teams');
            if (!teamsResp) return;
            const tData = await teamsResp.json();
            if (tData.teams.length === 0) {
                document.getElementById('assignContent').innerHTML = '<div class="empty-state"><div class="empty-icon">' + ICONS.inbox + '</div><h3>No teams registered</h3><p>Create teams from the Teams page</p></div>';
                return;
            }
            let html = '<div class="table-container"><table><thead><tr><th>Team Code</th><th>Team Name</th><th>Challenge</th><th>Status</th></tr></thead><tbody>';
            for (const t of tData.teams) {
                const challCode = t.challenge_code || null;
                html += '<tr>';
                html += '<td><strong class="font-mono">' + escapeHtml(t.team_code) + '</strong></td>';
                html += '<td>' + escapeHtml(t.team_name) + '</td>';
                html += '<td>' + (challCode ? '<span class="badge badge-info">' + escapeHtml(challCode) + '</span>' : '<span class="text-muted">Not assigned</span>') + '</td>';
                html += '<td>' + getStatusBadge(t.status) + '</td>';
                html += '</tr>';
            }
            html += '</tbody></table></div>';
            document.getElementById('assignContent').innerHTML = html;
        }
        loadAssignments();
    </script>
</body>
</html>
