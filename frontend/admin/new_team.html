<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Team - Legacy Code Rescue</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <script src="/static/js/api.js"></script>
    <script>
        if (!API.isLoggedIn() || API.role !== 'admin') { window.location.href = '/login'; }
        function logout() { API.clearAuth(); window.location.href = '/login'; }
        document.body.innerHTML = renderAdminLayout('new-team', 'Create Team');
        initTheme();
        document.getElementById('pageContent').innerHTML = `
            <div class="page-header"><h1>Create New Team</h1><p>Register a new team with participants</p></div>
            <div class="steps" id="stepsIndicator">
                <div class="step active" id="step1Indicator"><span class="step-number">1</span>Team Info</div>
                <div class="step-divider"></div>
                <div class="step" id="step2Indicator"><span class="step-number">2</span>Participants</div>
                <div class="step-divider"></div>
                <div class="step" id="step3Indicator"><span class="step-number">3</span>Review</div>
            </div>
            <div class="card" style="max-width:720px;">
                <div id="error-msg" class="error-message"></div>
                <div id="success-msg" class="success-message"></div>
                <div id="step1">
                    <h3 style="margin-bottom:16px;">Team Information</h3>
                    <div class="form-group"><label>Team Name</label><input type="text" id="teamName" placeholder="Enter a unique team name" required></div>
                    <div class="form-group"><label>Assign Challenge</label>
                        <select id="challengeCode"><option value="">No challenge (assign later)</option></select>
                    </div>
                    <div class="form-group"><label>Number of Participants</label>
                        <select id="participantCount" required><option value="">Select count</option><option value="1">1 Member</option><option value="2">2 Members</option><option value="3">3 Members</option><option value="4">4 Members</option></select>
                    </div>
                    <button class="btn btn-primary" onclick="goToStep2()" style="width:auto;">Next: Add Participants</button>
                </div>
                <div id="step2" style="display:none;">
                    <h3 style="margin-bottom:16px;">Participant Details</h3>
                    <div id="participantsContainer"></div>
                    <div style="display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;">
                        <button class="btn btn-secondary" onclick="goToStep1()" style="width:auto;">Back</button>
                        <button class="btn btn-primary" onclick="goToStep3()" style="width:auto;">Next: Review</button>
                    </div>
                </div>
                <div id="step3" style="display:none;">
                    <h3 style="margin-bottom:16px;">Review & Create</h3>
                    <div id="reviewContent"></div>
                    <div style="display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;">
                        <button class="btn btn-secondary" onclick="goToStep2()" style="width:auto;">Back</button>
                        <button class="btn btn-success" onclick="submitTeam()" id="submitBtn" style="width:auto;">Create Team</button>
                    </div>
                </div>
            </div>
        `;
        (async function loadChallenges() {
            try {
                const resp = await API.get('/api/admin/challenges');
                if (!resp) return;
                const data = await resp.json();
                const sel = document.getElementById('challengeCode');
                for (const ch of (data.challenges || [])) {
                    const opt = document.createElement('option');
                    opt.value = ch.challenge_code;
                    opt.textContent = ch.challenge_code + ' — ' + (ch.challenge_name || ch.name || ch.title || '');
                    sel.appendChild(opt);
                }
            } catch (e) {}
        })();
        function goToStep1() {
            hideError('error-msg'); hideSuccess('success-msg');
            document.getElementById('step1').style.display = '';
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').style.display = 'none';
            document.getElementById('step1Indicator').className = 'step active';
            document.getElementById('step2Indicator').className = 'step';
            document.getElementById('step3Indicator').className = 'step';
        }
        function goToStep2() {
            hideError('error-msg');
            const name = document.getElementById('teamName').value.trim();
            const count = parseInt(document.getElementById('participantCount').value);
            if (!name) { showError('error-msg', 'Enter a team name'); return; }
            if (isNaN(count) || count < 1) { showError('error-msg', 'Select number of participants'); return; }
            const container = document.getElementById('participantsContainer');
            if (container.children.length === 0) {
                for (let i = 0; i < count; i++) {
                    const isLeader = i === 0;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.style.marginBottom = '12px';
                    card.innerHTML = `
                        <h4 style="margin-bottom:12px; font-size:14px; color:${isLeader ? 'var(--primary)' : 'var(--text-secondary)'}">
                            ${isLeader ? '[LEADER] ' : ''}Participant ${i + 1}
                        </h4>
                        <div class="grid-2">
                            <div class="form-group"><label>Full Name *</label><input type="text" name="p${i}_name" placeholder="Enter full name" required></div>
                            <div class="form-group"><label>Email *</label><input type="email" name="p${i}_email" placeholder="email@example.com" required></div>
                            <div class="form-group"><label>Roll Number</label><input type="text" name="p${i}_roll" placeholder="e.g. 21CS001"></div>
                            <div class="form-group"><label>College</label><input type="text" name="p${i}_college" placeholder="e.g. MIT"></div>
                            <div class="form-group"><label>Phone</label><input type="text" name="p${i}_phone" placeholder="+91 XXXXX XXXXX"></div>
                        </div>
                    `;
                    container.appendChild(card);
                }
            }
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = '';
            document.getElementById('step1Indicator').className = 'step completed';
            document.getElementById('step2Indicator').className = 'step active';
        }
        function goToStep3() {
            hideError('error-msg');
            const count = parseInt(document.getElementById('participantCount').value);
            for (let i = 0; i < count; i++) {
                const nm = document.querySelector(`[name="p${i}_name"]`).value.trim();
                const em = document.querySelector(`[name="p${i}_email"]`).value.trim();
                if (!nm || !em) { showError('error-msg', `Fill name and email for Participant ${i + 1}`); return; }
            }
            let html = `<div style="padding:12px; background:var(--bg-input); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:12px;">
                <p><strong>Team Name:</strong> ${escapeHtml(document.getElementById('teamName').value.trim())}</p>
                <p><strong>Members:</strong> ${count}</p>
                ${document.getElementById('challengeCode').value ? '<p><strong>Challenge:</strong> <span class="badge badge-info">' + escapeHtml(document.getElementById('challengeCode').value) + '</span></p>' : ''}
            </div>`;
            for (let i = 0; i < count; i++) {
                const nm = document.querySelector(`[name="p${i}_name"]`).value.trim();
                const em = document.querySelector(`[name="p${i}_email"]`).value.trim();
                const rl = document.querySelector(`[name="p${i}_roll"]`).value.trim();
                const cl = document.querySelector(`[name="p${i}_college"]`).value.trim();
                html += `<div style="padding:10px; background:var(--bg-input); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:8px; font-size:13px;">
                    <strong>${i === 0 ? '[LEADER] ' : ''}${escapeHtml(nm)}</strong> &mdash; ${escapeHtml(em)}
                    ${rl ? ' | Roll: ' + escapeHtml(rl) : ''} ${cl ? ' | ' + escapeHtml(cl) : ''}
                </div>`;
            }
            html += '<p style="margin-top:12px; font-size:12px; color:var(--text-muted);">Default password: <strong>participants@123</strong></p>';
            document.getElementById('reviewContent').innerHTML = html;
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').style.display = '';
            document.getElementById('step1Indicator').className = 'step completed';
            document.getElementById('step2Indicator').className = 'step completed';
            document.getElementById('step3Indicator').className = 'step active';
        }
        async function submitTeam() {
            hideError('error-msg'); hideSuccess('success-msg');
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerHTML = '<span class="loading-spinner"></span> Creating...';
            const count = parseInt(document.getElementById('participantCount').value);
            const participants = [];
            for (let i = 0; i < count; i++) {
                participants.push({
                    name: document.querySelector(`[name="p${i}_name"]`).value.trim(),
                    email: document.querySelector(`[name="p${i}_email"]`).value.trim(),
                    roll_number: document.querySelector(`[name="p${i}_roll"]`).value.trim(),
                    college: document.querySelector(`[name="p${i}_college"]`).value.trim(),
                    phone: document.querySelector(`[name="p${i}_phone"]`).value.trim(),
                    is_team_leader: i === 0
                });
            }
            try {
                const resp = await API.post('/api/admin/teams', { team_name: document.getElementById('teamName').value.trim(), participant_count: count, participants, challenge_code: document.getElementById('challengeCode').value || '' });
                const data = await resp.json();
                if (resp.ok) {
                    showSuccess('success-msg', `
                        <h3 style="margin-bottom:12px;">Team Created Successfully</h3>
                        <div style="padding:12px; background:var(--bg-input); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:12px;">
                            <p><strong>Team Code:</strong> <span class="font-mono" style="font-size:16px;">${escapeHtml(data.team_code)}</span></p>
                            <p><strong>Team Name:</strong> ${escapeHtml(data.team_name)}</p>
                            <p><strong>Bin:</strong> ${escapeHtml(data.bin_number)}</p>
                            <p><strong>Default Password:</strong> <code>${data.default_password}</code></p>
                        </div>
                        <p style="font-size:12px; color:var(--text-muted);">Share the team code with participants. They can log in with their email and the default password.</p>
                    `);
                    document.getElementById('step3').style.display = 'none';
                    document.getElementById('stepsIndicator').style.display = 'none';
                } else { showError('error-msg', data.detail || 'Failed to create team'); }
            } catch (err) { showError('error-msg', 'Connection error'); }
            btn.disabled = false; btn.innerHTML = 'Create Team';
        }
    </script>
</body>
</html>
