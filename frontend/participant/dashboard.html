<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Dashboard - Legacy Code Rescue</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        /* ============ SHARED ANIMATIONS ============ */
        @keyframes fadeSlideUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
        @keyframes fadeSlideDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        @keyframes scaleIn { from { opacity:0; transform:scale(.8); } to { opacity:1; transform:scale(1); } }
        @keyframes glowPulse { 0%,100% { filter:brightness(1); } 50% { filter:brightness(1.3); } }
        @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }
        @keyframes floatSlow { 0%,100% { transform:translateY(0) rotate(0deg); } 50% { transform:translateY(-6px) rotate(2deg); } }
        @keyframes shimmer { 0% { background-position:-200% 0; } 100% { background-position:200% 0; } }
        @keyframes ringPulse { 0% { transform:scale(1); opacity:.6; } 100% { transform:scale(2.2); opacity:0; } }
        @keyframes ringPulse2 { 0% { transform:scale(1); opacity:.4; } 100% { transform:scale(2.8); opacity:0; } }
        @keyframes borderGlow { 0%,100% { border-color:var(--primary); box-shadow:0 0 20px rgba(99,102,241,.15); } 50% { border-color:var(--secondary); box-shadow:0 0 30px rgba(6,182,212,.2); } }
        @keyframes textGlow { 0%,100% { text-shadow:0 0 20px rgba(99,102,241,.3); } 50% { text-shadow:0 0 40px rgba(6,182,212,.5); } }
        @keyframes rotate { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
        @keyframes ticker { 0% { transform:translateX(100%); } 100% { transform:translateX(-100%); } }
        @keyframes particleDrift { 0% { transform:translateY(100vh) rotate(0deg); opacity:0; } 10% { opacity:1; } 90% { opacity:1; } 100% { transform:translateY(-10vh) rotate(720deg); opacity:0; } }
        @keyframes typing { from { width:0; } to { width:100%; } }
        @keyframes blink { 50% { border-color:transparent; } }
        @keyframes urgentPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.02); } }
        @keyframes scoreCountUp { from { opacity:0; transform:scale(.5); } to { opacity:1; transform:scale(1); } }
        @keyframes confettiFall { 0% { transform:translateY(-10vh) rotate(0deg); opacity:1; } 100% { transform:translateY(100vh) rotate(720deg); opacity:0; } }
        @keyframes successBounce { 0% { transform:scale(0); } 50% { transform:scale(1.2); } 70% { transform:scale(.9); } 100% { transform:scale(1); } }
        @keyframes slideReveal { from { clip-path:inset(0 100% 0 0); } to { clip-path:inset(0 0 0 0); } }
        @keyframes gradientShift { 0% { background-position:0% 50%; } 50% { background-position:100% 50%; } 100% { background-position:0% 50%; } }

        /* ============ UPCOMING PAGE ============ */
        .upcoming-scene { position:relative; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; background:var(--bg-root); }

        .particle-field { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
        .particle { position:absolute; border-radius:50%; animation:particleDrift linear infinite; }

        .orbit-container { position:relative; width:160px; height:160px; margin-bottom:32px; animation:scaleIn 1s ease .2s both; }
        .orbit-ring { position:absolute; inset:0; border:2px solid var(--primary); border-radius:50%; opacity:.2; animation:ringPulse 3s ease infinite; }
        .orbit-ring:nth-child(2) { animation:ringPulse2 3s ease .5s infinite; border-color:var(--secondary); }
        .orbit-core { position:absolute; inset:30px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--secondary)); display:flex; align-items:center; justify-content:center; animation:glowPulse 3s ease infinite, float 6s ease infinite; box-shadow:0 0 60px rgba(99,102,241,.3), 0 0 120px rgba(6,182,212,.15); }
        .orbit-core svg { width:48px; height:48px; color:white; }

        .upcoming-title { font-size:clamp(32px,6vw,56px); font-weight:900; text-align:center; background:linear-gradient(135deg,var(--primary),var(--secondary),var(--accent)); background-size:200% 200%; animation:gradientShift 4s ease infinite, fadeSlideUp .8s ease .4s both; -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1.1; margin-bottom:12px; }
        .upcoming-tagline { font-size:clamp(13px,2vw,16px); color:var(--text-secondary); text-align:center; margin-bottom:40px; animation:fadeSlideUp .8s ease .5s both; letter-spacing:1px; text-transform:uppercase; }
        .upcoming-tagline .blink-cursor { display:inline-block; width:2px; height:1em; background:var(--primary); margin-left:4px; animation:blink 1s step-end infinite; vertical-align:text-bottom; }

        .countdown-stage { display:flex; gap:12px; margin-bottom:40px; animation:fadeSlideUp .8s ease .6s both; perspective:800px; }
        .cd-block { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:20px 24px; min-width:90px; text-align:center; animation:floatSlow 5s ease infinite; transition:var(--transition-slow); position:relative; overflow:hidden; }
        .cd-block::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(99,102,241,.05),rgba(6,182,212,.05)); opacity:0; transition:opacity .3s; }
        .cd-block:hover { transform:translateY(-4px) scale(1.03); border-color:var(--primary); box-shadow:0 8px 30px rgba(99,102,241,.2); }
        .cd-block:hover::before { opacity:1; }
        .cd-block:nth-child(1) { animation-delay:0s; }
        .cd-block:nth-child(3) { animation-delay:.5s; }
        .cd-block:nth-child(5) { animation-delay:1s; }
        .cd-block:nth-child(7) { animation-delay:1.5s; }
        .cd-num { font-size:clamp(28px,4vw,42px); font-weight:800; font-family:var(--font-mono); display:block; line-height:1; background:linear-gradient(135deg,var(--primary),var(--secondary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; animation:textGlow 3s ease infinite; }
        .cd-label { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin-top:6px; display:block; }
        .cd-sep { font-size:clamp(24px,3vw,36px); font-weight:800; color:var(--text-muted); font-family:var(--font-mono); align-self:flex-start; padding-top:20px; opacity:.5; animation:glowPulse 2s ease infinite; }

        .team-badge-upcoming { display:inline-flex; align-items:center; gap:8px; padding:10px 20px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-full); font-size:13px; color:var(--text-secondary); animation:fadeSlideUp .8s ease .8s both; }
        .team-badge-upcoming .dot { width:8px; height:8px; border-radius:50%; background:var(--warning); animation:glowPulse 2s ease infinite; }

        .upcoming-cta { margin-top:24px; animation:fadeSlideUp .8s ease .9s both; }
        .upcoming-cta .btn { font-size:14px; padding:12px 28px; border-radius:var(--radius-full); background:linear-gradient(135deg,var(--primary),var(--secondary)); border:none; color:white; font-weight:600; cursor:default; position:relative; overflow:hidden; }
        .upcoming-cta .btn::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent); animation:shimmer 2s infinite; background-size:200% 100%; }

        /* ============ ONGOING DASHBOARD ============ */
        .dashboard-hero { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:28px; margin-bottom:20px; animation:fadeSlideUp .5s ease; position:relative; overflow:hidden; }
        .dashboard-hero::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent)); background-size:200% 100%; animation:shimmer 3s linear infinite; }

        .urgent-timer { text-align:center; padding:16px 20px; background:var(--bg-card); border:2px solid var(--warning); border-radius:var(--radius-md); margin-bottom:20px; animation:fadeSlideUp .5s ease .1s both, urgentPulse 2s ease infinite; position:relative; overflow:hidden; }
        .urgent-timer::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(245,158,11,.05),rgba(239,68,68,.05)); }
        .urgent-timer .timer-label { font-size:12px; font-weight:600; color:var(--warning); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; position:relative; }
        .urgent-timer .timer-value { font-size:clamp(28px,4vw,40px); font-weight:800; font-family:var(--font-mono); color:var(--warning); position:relative; text-shadow:0 0 20px rgba(245,158,11,.3); }

        .card { animation:fadeSlideUp .5s ease both; }
        .grid-2 .card:nth-child(1) { animation-delay:.1s; }
        .grid-2 .card:nth-child(2) { animation-delay:.15s; }
        .grid-2 + .card { animation-delay:.2s; }
        .grid-2 + .card + .grid-2 .card:nth-child(1) { animation-delay:.25s; }
        .grid-2 + .card + .grid-2 .card:nth-child(2) { animation-delay:.3s; }

        .member-card { background:var(--bg-input); border:1px solid var(--border); border-radius:var(--radius); padding:14px; transition:var(--transition-slow); animation:fadeSlideUp .4s ease both; }
        .member-card:hover { border-color:var(--primary-border); transform:translateX(4px); }
        .member-card.leader { border-color:var(--primary-border); background:linear-gradient(135deg,rgba(99,102,241,.05),rgba(6,182,212,.03)); }
        .member-card:nth-child(1) { animation-delay:.05s; }
        .member-card:nth-child(2) { animation-delay:.1s; }
        .member-card:nth-child(3) { animation-delay:.15s; }
        .member-card:nth-child(4) { animation-delay:.2s; }
        .member-card:nth-child(5) { animation-delay:.25s; }

        .ide-cta-wrap { animation:scaleIn .5s ease .3s both; }
        .ide-cta-wrap .btn { position:relative; overflow:hidden; }
        .ide-cta-wrap .btn::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent); animation:shimmer 2.5s infinite; background-size:200% 100%; }

        .challenge-reveal { animation:scaleIn .6s ease; position:relative; }
        .challenge-reveal .challenge-code { font-size:clamp(24px,4vw,36px); font-weight:800; font-family:var(--font-mono); background:linear-gradient(135deg,var(--secondary),var(--primary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; animation:textGlow 3s ease infinite; }

        .ann-item { padding:12px; background:var(--bg-input); border-radius:var(--radius); margin-bottom:8px; border-left:3px solid var(--primary); transition:var(--transition); animation:slideReveal .5s ease both; }
        .ann-item:hover { transform:translateX(4px); }
        .ann-item.urgent { border-left-color:var(--danger); }
        .ann-item.high { border-left-color:var(--warning); }
        .ann-item:nth-child(1) { animation-delay:.05s; }
        .ann-item:nth-child(2) { animation-delay:.1s; }
        .ann-item:nth-child(3) { animation-delay:.15s; }

        .stat-row { display:flex; gap:12px; margin-bottom:16px; }
        .stat-pill { flex:1; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px; text-align:center; animation:scaleIn .4s ease both; transition:var(--transition-slow); }
        .stat-pill:hover { border-color:var(--primary); transform:translateY(-2px); box-shadow:var(--shadow-md); }
        .stat-pill .stat-val { font-size:22px; font-weight:800; color:var(--primary); font-family:var(--font-mono); }
        .stat-pill .stat-lbl { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin-top:4px; }

        /* ============ COMPLETED PAGE ============ */
        .completed-scene { position:relative; min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px; overflow:hidden; }
        .confetti-piece { position:absolute; top:-10px; width:10px; height:10px; border-radius:2px; animation:confettiFall linear forwards; }

        .trophy-wrap { position:relative; margin-bottom:28px; animation:successBounce .8s ease .2s both; }
        .trophy-ring { position:absolute; inset:-16px; border:2px solid var(--success); border-radius:50%; opacity:.3; animation:ringPulse 2.5s ease infinite; }
        .trophy-ring:nth-child(2) { animation-delay:.7s; }
        .trophy-icon { width:100px; height:100px; border-radius:50%; background:linear-gradient(135deg,rgba(34,197,94,.1),rgba(99,102,241,.1)); border:2px solid var(--success); display:flex; align-items:center; justify-content:center; position:relative; }

        .completed-title { font-size:clamp(26px,4vw,36px); font-weight:800; margin-bottom:8px; animation:fadeSlideUp .6s ease .4s both; background:linear-gradient(135deg,var(--success),var(--secondary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .completed-sub { color:var(--text-muted); font-size:15px; margin-bottom:28px; animation:fadeSlideUp .6s ease .5s both; max-width:400px; }

        .score-showcase { display:flex; gap:16px; margin-bottom:28px; animation:fadeSlideUp .6s ease .6s both; }
        .score-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:20px 32px; text-align:center; transition:var(--transition-slow); position:relative; overflow:hidden; }
        .score-card::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(99,102,241,.03),rgba(6,182,212,.03)); }
        .score-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-lg); border-color:var(--primary); }
        .score-card .score-val { font-size:32px; font-weight:800; color:var(--primary); font-family:var(--font-mono); position:relative; animation:scoreCountUp .5s ease both; }
        .score-card .score-lbl { font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin-top:6px; position:relative; }

        /* ============ RESPONSIVE ============ */
        @media (max-width:640px) {
            .countdown-stage { gap:8px; }
            .cd-block { min-width:65px; padding:14px 10px; }
            .cd-num { font-size:24px; }
            .orbit-container { width:120px; height:120px; }
            .score-showcase { flex-direction:column; gap:10px; }
            .stat-row { flex-direction:column; gap:8px; }
        }
    </style>
</head>
<body>
    <script src="/static/js/api.js"></script>
    <script>
        if (!API.isLoggedIn() || API.role !== 'participant') { window.location.href = '/login'; }
        function logout() { API.clearAuth(); try { localStorage.removeItem('tc_accepted'); } catch(e) {} window.location.href = '/login'; }

        let serverTimeOffset = 0;
        async function syncServerTime() {
            try {
                const r = await fetch('/api/server-time');
                const d = await r.json();
                serverTimeOffset = new Date(d.server_time).getTime() - Date.now();
            } catch(e) {}
        }

        function generateParticles(count) {
            let html = '<div class="particle-field">';
            const colors = ['var(--primary)','var(--secondary)','var(--accent)','rgba(99,102,241,.3)','rgba(6,182,212,.3)'];
            for (let i = 0; i < count; i++) {
                const size = Math.random() * 4 + 2;
                const left = Math.random() * 100;
                const dur = Math.random() * 15 + 10;
                const delay = Math.random() * 15;
                const color = colors[Math.floor(Math.random() * colors.length)];
                html += `<div class="particle" style="width:${size}px;height:${size}px;left:${left}%;background:${color};animation-duration:${dur}s;animation-delay:-${delay}s;"></div>`;
            }
            html += '</div>';
            return html;
        }

        function generateConfetti(count) {
            let html = '';
            const colors = ['#6366f1','#06b6d4','#22c55e','#f472b6','#f59e0b','#ef4444'];
            for (let i = 0; i < count; i++) {
                const size = Math.random() * 8 + 6;
                const left = Math.random() * 100;
                const dur = Math.random() * 3 + 2;
                const delay = Math.random() * 2;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const rot = Math.random() * 360;
                html += `<div class="confetti-piece" style="width:${size}px;height:${size * .6}px;left:${left}%;background:${color};animation-duration:${dur}s;animation-delay:${delay}s;transform:rotate(${rot}deg);border-radius:${Math.random() > .5 ? '50%' : '2px'};"></div>`;
            }
            return html;
        }

        /* ==================== UPCOMING ==================== */
        function renderUpcoming(teamName, teamCode, countdownSeconds) {
            document.body.innerHTML = generateParticles(40) + `
                <div style="position:fixed;top:16px;right:16px;z-index:100;animation:fadeIn .8s ease 1s both;">
                    <button class="btn btn-secondary" onclick="logout()" style="font-size:12px;border-radius:var(--radius-full);backdrop-filter:blur(8px);">${ICONS.logout} Logout</button>
                </div>
                <div class="upcoming-scene">
                    <div class="orbit-container">
                        <div class="orbit-ring"></div>
                        <div class="orbit-ring"></div>
                        <div class="orbit-core">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        </div>
                    </div>
                    <div class="upcoming-title">Legacy Code Rescue</div>
                    <div class="upcoming-tagline">Debugging & Bug-Bounty Challenge<span class="blink-cursor"></span></div>
                    <div id="countdownClock" class="countdown-stage"></div>
                    <div class="team-badge-upcoming"><span class="dot"></span>${escapeHtml(teamName)} &middot; <strong>${escapeHtml(teamCode)}</strong></div>
                    <div class="upcoming-cta"><button class="btn" disabled>Get Ready...</button></div>
                </div>`;

            let remaining = countdownSeconds;
            function tick() {
                if (remaining <= 0) {
                    const el = document.getElementById('countdownClock');
                    if (el) el.innerHTML = '<div style="animation:scaleIn .5s ease;font-size:20px;font-weight:700;color:var(--success);">Event Starting...</div>';
                    setTimeout(() => location.reload(), 2000);
                    return;
                }
                const d = Math.floor(remaining / 86400);
                const h = Math.floor((remaining % 86400) / 3600);
                const m = Math.floor((remaining % 3600) / 60);
                const s = remaining % 60;
                let html = '';
                if (d > 0) html += `<div class="cd-block"><span class="cd-num">${String(d).padStart(2,'0')}</span><span class="cd-label">Days</span></div><span class="cd-sep">:</span>`;
                html += `<div class="cd-block"><span class="cd-num">${String(h).padStart(2,'0')}</span><span class="cd-label">Hours</span></div><span class="cd-sep">:</span>`;
                html += `<div class="cd-block"><span class="cd-num">${String(m).padStart(2,'0')}</span><span class="cd-label">Min</span></div><span class="cd-sep">:</span>`;
                html += `<div class="cd-block"><span class="cd-num">${String(s).padStart(2,'0')}</span><span class="cd-label">Sec</span></div>`;
                document.getElementById('countdownClock').innerHTML = html;
                remaining--;
                setTimeout(tick, 1000);
            }
            tick();
        }

        /* ==================== COMPLETED ==================== */
        function renderCompleted(teamName, teamCode, submission) {
            document.body.innerHTML = generateConfetti(60) + `
                <div style="position:fixed;top:16px;right:16px;z-index:100;animation:fadeIn .8s ease 1s both;">
                    <button class="btn btn-secondary" onclick="logout()" style="font-size:12px;border-radius:var(--radius-full);">${ICONS.logout} Logout</button>
                </div>
                <div class="completed-scene">
                    <div class="trophy-wrap">
                        <div class="trophy-ring"></div>
                        <div class="trophy-ring"></div>
                        <div class="trophy-icon">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
                        </div>
                    </div>
                    <div class="completed-title">Event Ended</div>
                    <div class="completed-sub">The challenge period has concluded. Thank you for your participation!</div>
                    ${submission ? `
                    <div class="score-showcase">
                        <div class="score-card"><div class="score-val">${submission.score}/${submission.total}</div><div class="score-lbl">Score</div></div>
                        <div class="score-card"><div class="score-val" style="font-size:20px;">${getStatusBadge(submission.status)}</div><div class="score-lbl">Status</div></div>
                    </div>` : ''}
                    <div class="team-badge-upcoming" style="animation-delay:.7s;"><span class="dot" style="background:var(--success);"></span>${escapeHtml(teamName)} &middot; <strong>${escapeHtml(teamCode)}</strong></div>
                </div>`;
        }

        /* ==================== ONGOING DASHBOARD ==================== */
        function hasAcceptedTC() {
            try { return localStorage.getItem('tc_accepted') === 'true'; } catch(e) { return false; }
        }
        function acceptTC() {
            try { localStorage.setItem('tc_accepted', 'true'); } catch(e) {}
            API.post('/api/participant/accept-tc', {}).catch(() => {});
            const modal = document.getElementById('tcModal');
            if (modal) modal.style.display = 'none';
            const ideBtn = document.getElementById('openIdeBtn');
            if (ideBtn) { ideBtn.disabled = false; ideBtn.onclick = function() { window.location.href = '/participant/ide'; }; }
        }
        function showTCModal() {
            const modal = document.getElementById('tcModal');
            if (modal) modal.style.display = 'flex';
        }
        function handleOpenIDE() {
            if (hasAcceptedTC()) {
                window.location.href = '/participant/ide';
            } else {
                showTCModal();
            }
        }

        function renderOngoingDashboard(data) {
            document.body.innerHTML = renderParticipantLayout('dashboard', 'Dashboard');
            initTheme();
            document.getElementById('pageContent').innerHTML = `
                <div class="dashboard-hero" id="heroSection">
                    <div class="flex-between" style="flex-wrap:wrap; gap:12px;">
                        <div>
                            <h1 id="teamName" style="font-size:22px; font-weight:700;">Loading...</h1>
                            <p style="color:var(--text-muted); font-size:13px;">Team Code: <strong class="font-mono" id="teamCodeDisplay">-</strong></p>
                        </div>
                        <div style="text-align:right;">
                            <p style="color:var(--text-muted); font-size:12px; margin-bottom:4px;">Event Status</p>
                            <div id="eventStatusBadge"></div>
                        </div>
                    </div>
                </div>
                <div id="countdownSection"></div>
                <div class="stat-row" id="statRow"></div>

                <div class="card mb-3" style="border:2px solid var(--primary);position:relative;overflow:hidden;">
                    <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent));background-size:200% 100%;animation:shimmer 3s linear infinite;"></div>
                    <div class="card-header"><h3 style="color:var(--primary);">Assigned Challenge</h3></div>
                    <div id="challengeInfo" style="text-align:center;padding:24px;"><span class="loading-spinner"></span></div>
                </div>

                <div class="grid-2 mb-3">
                    <div class="card">
                        <div class="card-header"><h3>Team Members</h3></div>
                        <div id="teamInfo"><div class="flex-center" style="padding:16px;"><span class="loading-spinner"></span></div></div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3>Team Details</h3></div>
                        <div id="teamDetails" style="padding:8px;">
                            <div style="margin-bottom:12px;"><span class="text-muted" style="font-size:12px;">Team Code</span><div class="font-mono font-semibold" id="teamCodeDetail">-</div></div>
                            <div style="margin-bottom:12px;"><span class="text-muted" style="font-size:12px;">Members</span><div class="font-semibold" id="memberCountDetail">-</div></div>
                        </div>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="card">
                        <div class="card-header"><h3>Submission Status</h3></div>
                        <div id="submissionInfo"><p class="text-muted" style="font-size:13px;">No submissions yet</p></div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3>Announcements</h3></div>
                        <div id="announcements"><div class="flex-center" style="padding:16px;"><span class="loading-spinner"></span></div></div>
                    </div>
                </div>

                <div id="tcModal" style="position:fixed;inset:0;background:var(--bg-overlay);z-index:2000;display:none;align-items:center;justify-content:center;padding:16px;">
                    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:28px;max-width:560px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-xl);">
                        <h2 style="font-size:20px;font-weight:700;margin-bottom:16px;color:var(--text-primary);">Terms & Conditions</h2>
                        <div style="font-size:13px;color:var(--text-secondary);line-height:1.7;margin-bottom:20px;">
                            <p style="margin-bottom:12px;">By proceeding to the IDE, you agree to the following:</p>
                            <ol style="padding-left:20px;margin-bottom:12px;">
                                <li style="margin-bottom:8px;"><strong>Academic Integrity:</strong> This challenge is designed for learning and assessment. Any attempt to exploit vulnerabilities in the platform infrastructure (rather than the provided code) is strictly prohibited.</li>
                                <li style="margin-bottom:8px;"><strong>Fair Play:</strong> Each team must work independently. Sharing solutions, code, or hints with other teams during the event is not allowed.</li>
                                <li style="margin-bottom:8px;"><strong>Code Submissions:</strong> All code submitted through the platform becomes part of your team's official submission. Ensure your code compiles and runs correctly before submitting.</li>
                                <li style="margin-bottom:8px;"><strong>Time Limit:</strong> The event timer begins when you first open the IDE. Manage your time carefully as the timer cannot be paused or extended.</li>
                                <li style="margin-bottom:8px;"><strong>Conduct:</strong> Respect all participants and organizers. Harassment, cheating, or any form of misconduct will result in disqualification.</li>
                            </ol>
                            <p style="font-size:12px;color:var(--text-muted);">Failure to comply with these terms may result in immediate disqualification from the event.</p>
                        </div>
                        <div style="display:flex;gap:8px;justify-content:flex-end;">
                            <button class="btn btn-ghost" onclick="logout()">Decline & Logout</button>
                            <button class="btn btn-primary" onclick="acceptTC()">Accept & Continue</button>
                        </div>
                    </div>
                </div>`;
            populateDashboard(data);
        }

        function populateDashboard(data) {
            document.getElementById('teamName').textContent = data.team_name || 'Unknown Team';
            document.getElementById('teamCodeDisplay').textContent = data.team_code;
            document.getElementById('eventStatusBadge').innerHTML = getStatusBadge(data.event_status);
            document.getElementById('teamCodeDetail').textContent = data.team_code;
            document.getElementById('memberCountDetail').textContent = (data.participants || []).length;

            const memberCount = (data.participants || []).length;
            const hasAlloc = data.allocation && data.allocation.released && data.allocation.challenge_code;
            document.getElementById('statRow').innerHTML = `
                <div class="stat-pill" style="animation-delay:.05s;"><div class="stat-val">${memberCount}</div><div class="stat-lbl">Members</div></div>
                <div class="stat-pill" style="animation-delay:.1s;"><div class="stat-val">${hasAlloc ? '1' : '0'}</div><div class="stat-lbl">Challenge</div></div>
                <div class="stat-pill" style="animation-delay:.15s;"><div class="stat-val">${data.submission ? '1' : '0'}</div><div class="stat-lbl">Submissions</div></div>`;

            const cs = document.getElementById('countdownSection');
            cs.innerHTML = '';
            if (data.event_status === 'ONGOING' && data.remaining_seconds !== null && data.remaining_seconds !== undefined) {
                let rem = data.remaining_seconds;
                function tickRemaining() {
                    if (rem <= 0) {
                        cs.innerHTML = '<div class="urgent-timer"><div class="timer-label">Time Expired</div><div class="timer-value">00:00:00</div></div>';
                        setTimeout(() => loadDashboard(), 2000);
                        return;
                    }
                    const h = Math.floor(rem / 3600);
                    const m = Math.floor((rem % 3600) / 60);
                    const s = rem % 60;
                    const isUrgent = rem < 600;
                    const borderColor = isUrgent ? 'var(--danger)' : 'var(--warning)';
                    const pulseAnim = isUrgent ? 'urgentPulse 1s ease infinite' : 'urgentPulse 2s ease infinite';
                    cs.innerHTML = `<div class="urgent-timer" style="border-color:${borderColor};animation:fadeSlideUp .5s ease,${pulseAnim};">
                        <div class="timer-label" style="color:${borderColor};">${isUrgent ? 'Time Running Out!' : 'Time Remaining'}</div>
                        <div class="timer-value" style="color:${borderColor};text-shadow:0 0 20px ${isUrgent ? 'rgba(239,68,68,.4)' : 'rgba(245,158,11,.3)'};">${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div>
                    </div>`;
                    rem--;
                    setTimeout(tickRemaining, 1000);
                }
                tickRemaining();
            }

            let membersHtml = '';
            for (const p of (data.participants || [])) {
                membersHtml += '<div class="member-card ' + (p.is_team_leader ? 'leader' : '') + '"><strong>' + (p.is_team_leader ? '[LEADER] ' : '') + escapeHtml(p.name) + '</strong>' + (p.is_team_leader ? ' <span class="badge badge-info">LEADER</span>' : '') + '<br><small class="text-muted">' + escapeHtml(p.email) + (p.roll_number ? ' | ' + escapeHtml(p.roll_number) : '') + '</small></div>';
            }
            document.getElementById('teamInfo').innerHTML = membersHtml || '<p class="text-muted" style="font-size:13px;">No participants</p>';

            const alloc = data.allocation;
            if (alloc && alloc.released && alloc.challenge_code) {
                const ch = data.challenge || {};
                const challengeName = ch.challenge_name || ch.language || alloc.challenge_code;
                const difficulty = ch.difficulty || '';
                const language = ch.language || '';
                const diffColors = { 'easy': '#22c55e', 'medium': '#f59e0b', 'hard': '#ef4444' };
                const diffColor = diffColors[difficulty.toLowerCase()] || 'var(--text-muted)';
                document.getElementById('challengeInfo').innerHTML = `
                    <div class="challenge-reveal">
                        <div style="font-size:13px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px;">Your Assigned Challenge</div>
                        <div class="challenge-code">${escapeHtml(challengeName)}</div>
                        <div style="margin:12px 0 20px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                            <span style="font-size:12px; padding:4px 12px; border-radius:var(--radius-full); background:rgba(6,182,212,.1); color:var(--secondary); border:1px solid rgba(6,182,212,.2); font-family:var(--font-mono);">${escapeHtml(alloc.challenge_code)}</span>
                            ${language ? '<span style="font-size:12px; padding:4px 12px; border-radius:var(--radius-full); background:rgba(99,102,241,.1); color:var(--primary); border:1px solid rgba(99,102,241,.2);">' + escapeHtml(language) + '</span>' : ''}
                            ${difficulty ? '<span style="font-size:12px; padding:4px 12px; border-radius:var(--radius-full); background:rgba(255,255,255,.05); color:' + diffColor + '; border:1px solid ' + diffColor + '30; text-transform:uppercase; font-weight:600;">' + escapeHtml(difficulty) + '</span>' : ''}
                        </div>
                        ${ch.description ? '<p style="color:var(--text-secondary); font-size:14px; margin-bottom:20px; max-width:500px; margin-left:auto; margin-right:auto; line-height:1.6;">' + escapeHtml(ch.description) + '</p>' : ''}
                        <div class="ide-cta-wrap" style="margin-top:16px;">
                            <button id="openIdeBtn" class="btn" onclick="handleOpenIDE()" style="
                                display:inline-flex; align-items:center; gap:10px;
                                padding:18px 48px; font-size:18px; font-weight:700;
                                border-radius:var(--radius-full); text-decoration:none; color:white; border:none; cursor:pointer;
                                background:linear-gradient(135deg, #6366f1, #06b6d4);
                                box-shadow:0 4px 20px rgba(99,102,241,.4), 0 0 40px rgba(6,182,212,.2);
                                transition:all .3s ease; position:relative; overflow:hidden;
                                animation:glowPulse 3s ease infinite;
                            " onmouseover="this.style.transform='translateY(-3px) scale(1.02)'; this.style.boxShadow='0 8px 30px rgba(99,102,241,.5), 0 0 60px rgba(6,182,212,.3)';" onmouseout="this.style.transform=''; this.style.boxShadow='0 4px 20px rgba(99,102,241,.4), 0 0 40px rgba(6,182,212,.2)';">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                                OPEN IDE ENVIRONMENT
                                <span style="position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);animation:shimmer 2.5s infinite;background-size:200% 100%;"></span>
                            </button>
                            <p style="margin-top:10px;font-size:12px;color:var(--text-muted);">Start solving your challenge</p>
                        </div>
                    </div>`;
                const openIdeBtn = document.getElementById('openIdeBtn');
                if (openIdeBtn) {
                    if (hasAcceptedTC()) {
                        openIdeBtn.disabled = false;
                    } else {
                        openIdeBtn.disabled = true;
                    }
                }
            } else {
                document.getElementById('challengeInfo').innerHTML = '<p style="color:var(--text-muted); font-size:15px;">Challenge not yet released</p><p style="color:var(--text-muted); font-size:13px; margin-top:4px;">Wait for the organizer to release allocations</p>';
            }

            if (data.submission) {
                document.getElementById('submissionInfo').innerHTML = `
                    <div class="stat-row" style="margin-bottom:12px;">
                        <div class="stat-pill"><div class="stat-val">${data.submission.score}/${data.submission.total}</div><div class="stat-lbl">Score</div></div>
                    </div>
                    <p style="font-size:13px;"><strong>Submitted:</strong> ${formatDate(data.submission.submitted_at)}</p>
                    <p style="font-size:13px;margin-top:4px;">${getStatusBadge(data.submission.status)}</p>
                    ${data.submission.auto_submitted ? '<p style="font-size:12px; color:var(--warning); margin-top:4px;">Auto-submitted (time expired)</p>' : ''}
                    ${data.allow_multiple_submissions ? '<p style="font-size:12px; color:var(--text-muted); margin-top:4px;">You may resubmit while the event is active.</p>' : ''}`;
            }

            let annHtml = '';
            for (const a of (data.announcements || [])) {
                annHtml += '<div class="ann-item ' + (a.priority || '') + '"><strong style="font-size:13px;">' + escapeHtml(a.title) + '</strong><span class="badge badge-info" style="margin-left:8px;">' + escapeHtml(a.priority || 'normal') + '</span><p style="margin:4px 0; font-size:12px; color:var(--text-secondary);">' + escapeHtml(a.message) + '</p><small class="text-muted">' + formatDate(a.created_at) + '</small></div>';
            }
            document.getElementById('announcements').innerHTML = annHtml || '<p class="text-muted" style="font-size:13px;">No announcements</p>';
        }

        async function loadDashboard() {
            try {
                await syncServerTime();
                const resp = await API.get('/api/participant/dashboard');
                if (!resp) return;
                const data = await resp.json();
                const status = data.event_status;
                if (status === 'UPCOMING') {
                    renderUpcoming(data.team_name, data.team_code, data.countdown_seconds || 0);
                } else if (status === 'COMPLETED') {
                    renderCompleted(data.team_name, data.team_code, data.submission);
                } else {
                    renderOngoingDashboard(data);
                    if (!hasAcceptedTC()) { setTimeout(showTCModal, 500); }
                    else { try { localStorage.setItem('tc_accepted', 'true'); } catch(e) {} }
                }
            } catch (err) { console.error('Dashboard error:', err); }
        }
        loadDashboard();
    </script>
</body>
</html>
